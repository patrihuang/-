<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>二結點歌本速查</title>
  <style>
    :root{
      /* ✅ 全站字體放大 2 倍 */
      font-size: 200%;

      /* ✅ Theme variables (Dark default) */
      --bgTop:#07080b;
      --bgMid:#0b0c10;
      --bgBot:#07080b;

      --bg:#0b0c10; --card:#111318; --text:#e9eef6; --muted:#9aa6b2;
      --line:#232733; --btn:#1c2230; --btn2:#22314a; --accent:#7aa2ff;
      --radius:14px;

      /* ✅ 重要：把關鍵尺寸改成 rem，讓它跟字體同步放大 */
      --ctlH: 2.75rem;     /* 原本 44px 的概念 */
      --ctlPadY: .55rem;
      --ctlPadX: .70rem;

      /* ✅ 虛擬清單列高：改成 rem，字變大列也變大 */
      --rowH: 4.6rem;

      /* 左側複製欄 */
      --copyCol: 3.3rem;

      /* ✅ 三欄固定：10 個數字寬度 */
      --colFixed: 10ch;

      /* 其他欄位 */
      --colLang: 6.5rem;
      --colLen:  5.2rem;
      --colWho:  7.5rem;
      --colPage: 6.0rem;

      /* Grid（JS 會動態改） */
      --grid: var(--copyCol) var(--colFixed) var(--colFixed) var(--colFixed);

      /* ✅ RWD：更小螢幕時，縮窄固定欄位（仍然「像」10 碼寬） */
      --colFixedSm: 8ch;

      /* ✅ 置頂用：由 JS 量測 header 高度後寫入 */
      --headerH: 0px;

      font-synthesis-weight:none;
    }

    /* ✅ Light mode */
    html[data-theme="light"]{
      --bgTop:#f7f8fb;
      --bgMid:#f1f3f7;
      --bgBot:#edf0f5;

      --bg:#f2f4f8;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#475569;
      --line:#d9dee8;

      --btn:#eef2f7;
      --btn2:#e2e8f0;
      --accent:#2b6bff;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:linear-gradient(180deg, var(--bgTop), var(--bgMid) 40%, var(--bgBot));
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      touch-action: pan-x pan-y;
    }

    .wrap{max-width:1100px; margin:16px auto; padding:0 14px;}

    /* ✅ Header：置頂（固定在最上面） */
    header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
      flex-wrap:wrap;

      position: sticky;
      top: 0;
      z-index: 6000;

      /* 讓置頂時背後不透出 */
      padding: 14px 0 10px 0;
      background:linear-gradient(180deg, var(--bgTop), var(--bgMid) 40%, var(--bgBot));
      backdrop-filter: blur(10px);
    }

    h1{margin:0; font-size:1.35rem; letter-spacing:.5px}
    .sub{color:var(--muted); font-size:.82rem; margin-top:.35rem}

    /* ✅ 將「共..筆 顯示..筆」移到下一行 */
    .metaRow{
      flex: 1 1 100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:.6rem;
      margin-top:.35rem;
    }

    .pill{
      font-size:.78rem; color:var(--muted);
      padding:.35rem .6rem;
      border:1px solid rgba(255,255,255,.08);
      border-radius:999px;
      background:rgba(0,0,0,.18);
      white-space:nowrap;
    }
    html[data-theme="light"] .pill{
      border:1px solid rgba(15,23,42,.12);
      background:rgba(255,255,255,.75);
    }

    .card{
      background:rgba(17,19,24,.85);
      border:1px solid rgba(35,39,51,.9);
      border-radius:var(--radius);
      box-shadow:0 10px 30px rgba(0,0,0,.35);
      overflow:hidden;
      position:relative;
    }
    html[data-theme="light"] .card{
      background:rgba(255,255,255,.85);
      border:1px solid rgba(15,23,42,.10);
      box-shadow:0 10px 30px rgba(15,23,42,.10);
    }

    label{font-size:.78rem; color:var(--muted)}
    select, input{
      background:rgba(0,0,0,.25);
      color:var(--text);
      border:1px solid rgba(255,255,255,.1);
      border-radius:12px;
      padding: var(--ctlPadY) var(--ctlPadX);
      font-size:.95rem;
      outline:none;
      height:var(--ctlH);
      line-height:1.2;
      min-width: 0;
    }
    html[data-theme="light"] select,
    html[data-theme="light"] input{
      background:rgba(255,255,255,.95);
      border:1px solid rgba(15,23,42,.14);
    }

    input{min-width: 12rem;}
    input::placeholder{color:#7e8a96}
    html[data-theme="light"] input::placeholder{color:#64748b}

    .btn{
      background:var(--btn);
      border:1px solid rgba(255,255,255,.08);
      color:var(--text);
      padding: var(--ctlPadY) .85rem;
      border-radius:14px;
      cursor:pointer;
      font-size:.95rem;
      display:inline-flex; align-items:center; gap:.4rem;
      user-select:none;
      transition:.15s transform, .15s background;
      white-space:nowrap;
      height:var(--ctlH);
      line-height:1.2;
      font-weight:800;
    }
    html[data-theme="light"] .btn{ border:1px solid rgba(15,23,42,.12); }
    .btn:hover{background:var(--btn2)}
    .btn:active{transform:translateY(1px)}
    .btn.primary{
      background:rgba(122,162,255,.18);
      border-color:rgba(122,162,255,.45);
    }
    html[data-theme="light"] .btn.primary{
      background:rgba(43,107,255,.14);
      border-color:rgba(43,107,255,.35);
    }

    .iconBtn{
      width:var(--ctlH); height:var(--ctlH);
      padding:0;
      justify-content:center;
      border-radius:14px;
      flex: 0 0 auto;
    }
    .iconBtn svg{width:1.15rem; height:1.15rem}

    .xBtn{
      width:var(--ctlH); height:var(--ctlH);
      padding:0;
      justify-content:center;
      border-radius:14px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      font-weight:900;
      font-size:1.05rem;
      line-height:var(--ctlH);
      flex: 0 0 auto;
    }
    html[data-theme="light"] .xBtn{
      background:rgba(15,23,42,.04);
      border:1px solid rgba(15,23,42,.12);
    }

    /* ✅ 設定按鈕 */
    .settingsBtn{
      width:var(--ctlH); height:var(--ctlH);
      padding:0;
      justify-content:center;
      border-radius:14px;
    }
    .settingsBtn svg{width:1.15rem; height:1.15rem}

    /* ✅ (1)(2)：「查詢」那行獨立 + 只置頂查詢列 */
    .searchDock{
      position: sticky;
      top: var(--headerH);
      z-index: 5500;

      padding: .6rem .75rem;
      border-bottom:1px solid var(--line);

      background: rgba(0,0,0,.14);
      backdrop-filter: blur(10px);
    }
    html[data-theme="light"] .searchDock{
      background: rgba(255,255,255,.72);
    }

    .searchRow{
      display:flex;
      align-items:center;
      gap:.6rem;
      width:100%;
      flex-wrap: nowrap; /* ✅ 永遠同一橫排 */
      min-width:0;
    }
    .searchRow input{
      flex: 1 1 auto;
      min-width: 0;
    }

    /* ✅ (1) 篩選區：與查詢列分開，不置頂、可自由滑動 */
    .filtersArea{
      padding: .6rem .75rem;
      border-bottom: 1px solid var(--line);
    }

    /* ✅ (3) 收合 UI */
    .filtersHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:.6rem;
      margin-bottom:.45rem;
    }
    .filtersTitle{
      display:flex;
      align-items:center;
      gap:.5rem;
      color:var(--muted);
      font-size:.85rem;
      font-weight:900;
      user-select:none;
    }
    .collapseBtn{
      height:var(--ctlH);
      padding: var(--ctlPadY) .75rem;
      border-radius:14px;
      display:inline-flex;
      align-items:center;
      gap:.45rem;
      font-weight:900;
    }
    .collapseBtn svg{ width:1.05rem; height:1.05rem; transition: .18s transform; }
    .collapseBtn[aria-expanded="false"] svg{ transform: rotate(-90deg); }

    .filtersBody{
      overflow:hidden;
      max-height: 600px; /* 夠大即可，會用 JS 計算更精準 */
      transition: max-height .22s ease;
    }
    .filtersBody.collapsed{
      max-height: 0px;
    }

    /* ✅ 篩選列：預設橫排（大螢幕） */
    .filtersRow{
      display:flex;
      gap:.6rem;
      flex-wrap:wrap;
      align-items:flex-end;
      justify-content:flex-start;
      min-width: 0;
    }

    .filterItem{
      display:inline-flex;
      align-items:flex-end;
      gap:.45rem;
      min-width: 0;
    }
    .filterItem label{white-space:nowrap}
    .filterItem select{min-width: 7rem}

    .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .table-min-width{ min-width: 520px; }

    .thead{
      display:grid;
      grid-template-columns: var(--grid);
      padding:.6rem .75rem;
      font-size:.78rem;
      color:var(--muted);
      border-bottom:1px solid var(--line);
      background:rgba(0,0,0,.14);
      user-select:none;
    }
    html[data-theme="light"] .thead{ background:rgba(15,23,42,.04); }

    .th{
      padding:0 .45rem;
      display:flex; align-items:center; gap:.35rem;
      min-width:0;
    }
    .th:first-child{padding-left:.3rem}
    .th.sortable{cursor:pointer}
    .sortMark{font-size:.75rem; opacity:.9}
    .sortMark.off{opacity:.35}

    .viewport{
      height: 70vh;
      overflow:auto;
      position:relative;
    }
    .spacer{height:0px}
    .rows{
      position:absolute; left:0; top:0; right:0;
      padding:0 .75rem .5rem .75rem;
    }

    .row{
      display:grid;
      grid-template-columns: var(--grid);
      align-items:stretch;
      height:var(--rowH);
      border-bottom:1px solid rgba(35,39,51,.7);
      border-radius:10px;
      cursor:pointer;
    }
    html[data-theme="light"] .row{
      border-bottom:1px solid rgba(15,23,42,.10);
    }
    .row:hover{background:rgba(255,255,255,.04)}
    html[data-theme="light"] .row:hover{background:rgba(15,23,42,.04)}

    .cell{
      padding:.45rem .45rem;
      font-size:.9rem;
      min-width:0;
      overflow:hidden;
    }

    .cell.wrap2{
      white-space:normal;
      display:-webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow:hidden;
      line-height:1.25;
    }

    .cell.small{
      font-size:.78rem;
      color:#cdd6e1;
      white-space:nowrap;
      text-overflow:ellipsis;
    }
    html[data-theme="light"] .cell.small{color:#334155}

    .tag{
      display:inline-flex; align-items:center;
      border:1px solid rgba(255,255,255,.12);
      padding:.12rem .45rem; border-radius:999px;
      font-size:.78rem; color:#cdd6e1;
      background:rgba(255,255,255,.06);
      white-space:nowrap;
    }
    html[data-theme="light"] .tag{
      border:1px solid rgba(15,23,42,.12);
      color:#0f172a;
      background:rgba(15,23,42,.04);
    }

    .copyWrap{ display:flex; justify-content:center; align-items:center; }
    .copyBtn{
      width:2.15rem; height:1.85rem;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      color:var(--text);
      cursor:pointer;
      display:inline-flex; align-items:center; justify-content:center;
      transition:.15s transform, .15s background;
      user-select:none;
    }
    html[data-theme="light"] .copyBtn{
      border:1px solid rgba(15,23,42,.12);
      background:rgba(15,23,42,.03);
    }
    .copyBtn svg{width:1.05rem; height:1.05rem; opacity:.9}

    .toast{
      position:fixed; right:14px; bottom:14px;
      background:rgba(17,19,24,.92);
      border:1px solid rgba(255,255,255,.12);
      border-radius:14px;
      padding:.55rem .65rem;
      color:var(--text);
      box-shadow:0 12px 30px rgba(0,0,0,.4);
      display:none;
      max-width:min(520px, calc(100vw - 28px));
      font-size:.85rem;
      z-index:9999;
    }
    html[data-theme="light"] .toast{
      background:rgba(255,255,255,.92);
      border:1px solid rgba(15,23,42,.12);
      box-shadow:0 12px 30px rgba(15,23,42,.14);
    }
    .toast.show{display:block}
    .toast .t{color:var(--muted); font-size:.78rem; margin-top:.2rem}

    /* ✅ (4) 滑動至頂部 */
    .toTop{
      position: fixed;
      right: 14px;
      bottom: 78px; /* 避開 toast */
      z-index: 9998;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: .18s opacity, .18s transform;
    }
    .toTop.show{
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .modalBack{
      position:fixed; inset:0;
      background:rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding:16px;
      z-index:10000;
    }
    html[data-theme="light"] .modalBack{ background:rgba(15,23,42,.35); }
    .modalBack.show{display:flex}

    .modal{
      width:min(720px, 100%);
      background:rgba(17,19,24,.96);
      border:1px solid rgba(255,255,255,.14);
      border-radius:16px;
      box-shadow:0 18px 60px rgba(0,0,0,.55);
      overflow:hidden;
    }
    html[data-theme="light"] .modal{
      background:rgba(255,255,255,.96);
      border:1px solid rgba(15,23,42,.12);
      box-shadow:0 18px 60px rgba(15,23,42,.18);
    }
    .modalHead{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:.65rem .75rem;
      border-bottom:1px solid rgba(255,255,255,.10);
    }
    html[data-theme="light"] .modalHead{ border-bottom:1px solid rgba(15,23,42,.10); }
    .modalTitle{ font-weight:900; font-size:.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .modalClose{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:var(--text);
      border-radius:12px;
      padding:.45rem .55rem;
      cursor:pointer;
      font-size:.85rem;
      height:var(--ctlH);
      display:inline-flex; align-items:center;
    }
    html[data-theme="light"] .modalClose{
      background:rgba(15,23,42,.04);
      border:1px solid rgba(15,23,42,.12);
    }

    .modalBody{
      padding:.65rem .75rem;
      display:grid;
      grid-template-columns: 6.5rem 1fr;
      gap:.5rem .6rem;
      font-size:.9rem;
    }
    .k{color:var(--muted); font-size:.85rem}
    .v{color:var(--text); word-break:break-word}
    .modalFoot{
      padding:.65rem .75rem;
      border-top:1px solid rgba(255,255,255,.10);
      display:flex; gap:.6rem; justify-content:flex-end; flex-wrap:wrap;
    }
    html[data-theme="light"] .modalFoot{ border-top:1px solid rgba(15,23,42,.10); }

    /* ✅ 設定 Modal 的 body */
    .settingsBody{
      padding:.65rem .75rem .8rem .75rem;
      display:block;
      font-size:.9rem;
    }

    .settingsGrid{
      display:flex;
      flex-direction:column;
      gap:.75rem;
    }
    .settingsSection{
      display:flex;
      gap:.75rem;
      flex-wrap:wrap;
      align-items:center;
    }

    .chip{
      display:inline-flex; align-items:center; gap:.45rem;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
      padding:.35rem .6rem;
      border-radius:999px;
      font-size:.78rem;
      cursor:pointer;
      user-select:none;
      white-space:nowrap;
    }
    html[data-theme="light"] .chip{
      border:1px solid rgba(15,23,42,.12);
      background:rgba(255,255,255,.65);
    }
    .chip input{width:1rem; height:1rem; margin:0; accent-color: var(--accent);}

    .chip span{color:#cdd6e1}
    html[data-theme="light"] .chip span{color:#0f172a}

    .radioWrap{
      display:flex;
      align-items:center;
      gap:.7rem;
      padding:.35rem .6rem;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
      border-radius:999px;
      flex-wrap:wrap;
    }
    html[data-theme="light"] .radioWrap{
      border:1px solid rgba(15,23,42,.12);
      background:rgba(255,255,255,.65);
    }
    .radioWrap label{
      display:flex; align-items:center; gap:.45rem;
      color:var(--muted);
      font-size:.85rem;
      cursor:pointer;
      user-select:none;
    }
    .radioWrap input{width:1.05rem; height:1.05rem; accent-color:var(--accent)}

    /* ✅ RWD */
    @media (max-width: 900px){
      .wrap{margin:12px auto; padding:0 12px;}
      header{align-items:flex-start;}
      input{min-width: 10rem}
      .modalBody{grid-template-columns: 5.2rem 1fr}
      :root{ --colFixed: var(--colFixedSm); }
      .table-min-width{min-width: 460px}
    }

    @media (max-width: 520px){
      h1{font-size:1.15rem}
      .sub{font-size:.78rem}

      /* ✅ 等比例縮小（查詢列仍同一列） */
      :root{
        --ctlH: 2.35rem;
        --ctlPadY: .42rem;
        --ctlPadX: .55rem;
      }
      .btn{font-size:.88rem}
      .iconBtn svg{width:1.05rem; height:1.05rem}
      .xBtn{font-size:1.00rem}

      /* ✅ 篩選改垂直排列、且每一行同寬 */
      .filtersRow{
        width:100%;
        flex-direction:column;
        align-items:stretch;
        gap:.55rem;
      }
      .filterItem{
        width:100%;
        display:flex;
        flex-direction:column;
        align-items:stretch;
        gap:.35rem;
      }
      .filterItem label{
        font-size:.78rem;
        color:var(--muted);
      }
      .filterItem select{
        width:100%;
        min-width: 0;
      }

      .thead{padding:.55rem .6rem;}
      .rows{padding:0 .6rem .5rem .6rem;}
      .table-min-width{min-width: 420px}
    }
  </style>
</head>

<body>
<div class="wrap">
  <header id="topHeader">
    <div>
      <h1>二結點歌本速查</h1>
      <div class="sub">>Happy Happy</div>
    </div>

    <div class="metaRow">
      <div class="pill" id="countPill">載入中…</div>
      <button class="btn iconBtn settingsBtn" id="btnSettings" title="設定" aria-label="設定">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 15.25a3.25 3.25 0 1 0 0-6.5 3.25 3.25 0 0 0 0 6.5Z" stroke="currentColor" stroke-width="1.8"/>
          <path d="M19.4 13a7.86 7.86 0 0 0 .04-2l1.6-1.2-1.9-3.3-1.9.8a8.2 8.2 0 0 0-1.7-1l-.3-2H9.7l-.3 2a8.2 8.2 0 0 0-1.7 1l-1.9-.8-1.9 3.3 1.6 1.2a7.86 7.86 0 0 0 .04 2L4 14.2l1.9 3.3 1.9-.8c.52.42 1.1.77 1.7 1l.3 2h4.6l.3-2c.6-.23 1.18-.58 1.7-1l1.9.8 1.9-3.3-1.6-1.2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="card">
    <!-- ✅ 只置頂「查詢」那行 -->
    <div class="searchDock" id="searchDock">
      <div class="searchRow">
        <input id="q" placeholder="查詢（點🔍）" />
        <button class="btn primary iconBtn" id="btnFilter" title="套用文字查詢" aria-label="套用文字查詢">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="1.8"/>
            <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="btn xBtn" id="btnClearFilters" title="取消篩選/清空" aria-label="取消篩選">×</button>

        <!-- ✅ (3) 收合篩選 -->
        <button class="btn collapseBtn" id="btnToggleFilters" aria-expanded="true" title="收合/展開篩選">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M8 10l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          篩選
        </button>
      </div>
    </div>

    <!-- ✅ 篩選區：不置頂，跟著內容滑動 -->
    <div class="filtersArea" id="filtersArea">
      <div class="filtersBody" id="filtersBody">
        <div class="filtersRow">
          <div class="filterItem">
            <label for="filterLang">語言</label>
            <select id="filterLang"></select>
          </div>

          <div class="filterItem">
            <label for="filterLen">字數</label>
            <select id="filterLen"></select>
          </div>

<script src="./songs.js"></script>

<script>
if (!window.SONGS || !Array.isArray(window.SONGS)) {
  alert("songs.js 載入失敗，請確認檔案存在");
  throw new Error("SONGS not found");
}
const SONGS = window.SONGS;

// ===== 小工具 =====
const $ = (id) => document.getElementById(id);
const toast = (msg, sub="") => {
  $("toastMsg").textContent = msg;
  $("toastSub").textContent = sub;
  $("toast").classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2000);
};

function normalize(s){ return (s ?? "").toString().toLowerCase().trim(); }
function escapeHtml(s){
  return (s ?? "").toString()
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
async function copyToClipboard(text){
  try{ await navigator.clipboard.writeText(text); }
  catch(_){
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  }
}
function currentMatchMode(){
  return document.querySelector('input[name="matchMode"]:checked')?.value || "fuzzy";
}

/* ✅ Light mode (記住選擇) */
const THEME_KEY = "songbook_theme";
function setTheme(theme){
  if(theme === "light") document.documentElement.setAttribute("data-theme","light");
  else document.documentElement.removeAttribute("data-theme");
  try{ localStorage.setItem(THEME_KEY, theme); }catch(_){}
}
function getTheme(){
  try{ return localStorage.getItem(THEME_KEY) || "dark"; }catch(_){ return "dark"; }
}

/* ✅ 記住設定欄位顯示 */
const SHOWN_KEY = "songbook_shown_cols_v2";

/* ✅ 讓虛擬清單列高跟 CSS --rowH 同步 */
function getRowHPx(){
  const v = getComputedStyle(document.documentElement).getPropertyValue("--rowH").trim();
  const probe = document.createElement("div");
  probe.style.position = "absolute";
  probe.style.left = "-99999px";
  probe.style.width = v;
  document.body.appendChild(probe);
  const px = probe.getBoundingClientRect().width;
  document.body.removeChild(probe);
  return Math.max(24, Math.round(px));
}

/* ✅ 量測任意 CSS var 實際 px */
function measureVarPx(varName){
  const raw = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  const probe = document.createElement("div");
  probe.style.position = "absolute";
  probe.style.left = "-99999px";
  probe.style.width = raw;
  document.body.appendChild(probe);
  const px = probe.getBoundingClientRect().width;
  document.body.removeChild(probe);
  return px;
}

/* ✅ 置頂：量測 header 高度，讓 searchDock 緊貼在 header 下方 */
function updateDockHeights(){
  const h = $("topHeader")?.offsetHeight || 0;
  document.documentElement.style.setProperty("--headerH", h + "px");
}

/* ✅ 設定 Modal 開關 */
function openSettings(){
  $("settingsBack").classList.add("show");
  $("settingsBack").setAttribute("aria-hidden","false");
}
function closeSettings(){
  $("settingsBack").classList.remove("show");
  $("settingsBack").setAttribute("aria-hidden","true");
}

/* ✅ (3) 收合篩選（預設展開） */
let filtersCollapsed = false;
function setFiltersCollapsed(v){
  filtersCollapsed = !!v;
  const body = $("filtersBody");
  const btn = $("btnToggleFilters");

  btn.setAttribute("aria-expanded", (!filtersCollapsed).toString());
  if(filtersCollapsed){
    body.classList.add("collapsed");
  }else{
    body.classList.remove("collapsed");
    // 展開時用 scrollHeight 讓動畫更準（避免小螢幕高度變化）
    requestAnimationFrame(() => {
      // 不用寫死高度，只要確保 maxHeight 夠
      // 這裡保留 class 切換即可（CSS max-height 600px）
    });
  }
}
function toggleFilters(){
  setFiltersCollapsed(!filtersCollapsed);
}

/* ✅ (4) 滑動至頂部（主要是表格 viewport） */
function scrollToTop(){
  const vp = $("viewport");
  if(vp){
    vp.scrollTo({ top: 0, behavior: "smooth" });
  }
  // 若頁面本身也有捲動，順便回頂（不影響桌機）
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function updateToTopVisible(){
  const vp = $("viewport");
  const show = (vp && vp.scrollTop > 220) || window.scrollY > 220;
  $("btnToTop").classList.toggle("show", !!show);
}

// ===== 狀態 =====
let base = [];
let viewUIDs = [];
let copyLine = [];

let sortKey = "";
let sortDir = "";

const shown = { lang:false, len:false, who:false, page:false, book:false };
const filters = { lang:"", len:"", who:"" };

// ===== 欄位定義 =====
const COLS_BASE = [
  { key:"copy",  label:"",     sortable:false, widthVar:"--copyCol" },
  { key:"id",    label:"編號", sortable:true,  widthVar:"--colFixed", wrap2:true },
  { key:"title", label:"歌名", sortable:true,  widthVar:"--colFixed", wrap2:true },
  { key:"artist",label:"歌手", sortable:true,  widthVar:"--colFixed", wrap2:true },
];
const COLS_EXTRA = [
  { key:"lang", label:"語言", sortable:true, widthVar:"--colLang" },
  { key:"len",  label:"字數", sortable:true, widthVar:"--colLen" },
  { key:"who",  label:"誰的歌", sortable:true, widthVar:"--colWho" },
  { key:"page", label:"頁數", sortable:true, widthVar:"--colPage" },
  { key:"book", label:"歌本", sortable:true, widthVar:"--colWho" },
];

// ===== 虛擬清單設定 =====
let ROW_H = 72;
const OVERSCAN = 10;

// ===== 初始化 =====
function init(){
  const theme = getTheme();
  setTheme(theme);

  updateDockHeights();
  ROW_H = getRowHPx();

  loadShownSettings();

  $("toggleLight").checked = (theme === "light");
  $("colLang").checked = shown.lang;
  $("colLen").checked  = shown.len;
  $("colWho").checked  = shown.who;
  $("colPage").checked = shown.page;
  $("colBook").checked = shown.book;

  base = SONGS.map(r => ({
    who: (r.who ?? "").toString().trim(),
    id: (r.id ?? "").toString().trim(),
    title: (r.title ?? "").toString().trim(),
    artist: (r.artist ?? "").toString().trim(),
    lang: (r.lang ?? "").toString().trim(),
    page: (r.page ?? "").toString().trim(),
    len: (r.len ?? "").toString().trim(),
    book: ((r.book ?? r.songbook ?? r.bookName ?? "")).toString().trim(),
  }));

  copyLine = base.map(r => [
    r.who, r.id, r.title, r.artist, r.lang, r.page, r.len, r.book
  ].filter(x => x !== "").join("\t"));

  buildFilterOptions();
  bindUI();

  // ✅ 預設展開
  setFiltersCollapsed(false);

  rebuildColumnsAndHeader();
  applyFilterSortRender(true);
  updateToTopVisible();
}

/* ✅ 記住/還原欄位顯示 */
function saveShownSettings(){
  try{ localStorage.setItem(SHOWN_KEY, JSON.stringify(shown)); }catch(_){}
}
function loadShownSettings(){
  try{
    const raw = localStorage.getItem(SHOWN_KEY);
    if(!raw) return;
    const obj = JSON.parse(raw);
    if(obj && typeof obj === "object"){
      for(const k of ["lang","len","who","page","book"]){
        if(typeof obj[k] === "boolean") shown[k] = obj[k];
      }
    }
  }catch(_){}
}

// ===== 下拉選單選項 =====
const MAX_OPTIONS = 250;
function uniqueValues(key){
  const set = new Set();
  for(const r of base){
    const v = (r[key] ?? "").toString().trim();
    if(v) set.add(v);
  }
  return Array.from(set);
}
function setSelectOptions(selectEl, values, placeholder="全部"){
  selectEl.innerHTML = "";
  selectEl.appendChild(new Option(placeholder, ""));
  if(values.length > MAX_OPTIONS){
    const opt = new Option(`（選項太多：${values.length}）`, "");
    opt.disabled = true;
    selectEl.appendChild(opt);
    return;
  }
  for(const v of values) selectEl.appendChild(new Option(v, v));
}
function buildFilterOptions(){
  const langs = uniqueValues("lang").sort((a,b)=>a.localeCompare(b, "zh-Hant"));
  const whos  = uniqueValues("who").sort((a,b)=>a.localeCompare(b, "zh-Hant"));
  const lens  = uniqueValues("len").sort((a,b)=> (Number(a)||0) - (Number(b)||0));
  setSelectOptions($("filterLang"), langs, "全部");
  setSelectOptions($("filterLen"), lens, "全部");
  setSelectOptions($("filterWho"), whos, "全部");
}

// ===== UI 綁定 =====
function bindUI(){
  $("btnSettings").addEventListener("click", openSettings);
  $("settingsClose").addEventListener("click", closeSettings);
  $("settingsDone").addEventListener("click", closeSettings);
  $("settingsBack").addEventListener("click", (e) => {
    if(e.target === $("settingsBack")) closeSettings();
  });

  $("toggleLight").addEventListener("change", () => {
    setTheme($("toggleLight").checked ? "light" : "dark");
    updateDockHeights();
    ROW_H = getRowHPx();
    rebuildColumnsAndHeader();
    applyFilterSortRender(true);
    toast($("toggleLight").checked ? "已切換淺色模式" : "已切換深色模式");
  });

  // ✅ (3) 收合篩選
  $("btnToggleFilters").addEventListener("click", () => {
    toggleFilters();
    toast(filtersCollapsed ? "已收合篩選" : "已展開篩選");
  });

  // ✅ (4) 滑到頂部
  $("btnToTop").addEventListener("click", scrollToTop);

  $("q").addEventListener("keydown", (e) => {
    if(e.key === "Enter"){
      applyFilterSortRender();
      toast("已套用文字查詢", `顯示 ${viewUIDs.length.toLocaleString()} 筆`);
    }else if(e.key === "Escape"){
      $("q").value = "";
      toast("已清空文字輸入", "（不自動篩選）");
    }
  });
  $("btnFilter").addEventListener("click", () => {
    applyFilterSortRender();
    toast("已套用篩選", `顯示 ${viewUIDs.length.toLocaleString()} 筆`);
  });

  $("btnClearFilters").addEventListener("click", () => {
    $("q").value = "";
    filters.lang = filters.len = filters.who = "";
    $("filterLang").value = "";
    $("filterLen").value = "";
    $("filterWho").value = "";
    sortKey = ""; sortDir = "";
    rebuildColumnsAndHeader();
    applyFilterSortRender();
    toast("已清空", "文字/下拉/排序 已重置");
  });

  $("filterLang").addEventListener("change", () => { filters.lang = $("filterLang").value; applyFilterSortRender(); });
  $("filterLen").addEventListener("change",  () => { filters.len  = $("filterLen").value;  applyFilterSortRender(); });
  $("filterWho").addEventListener("change",  () => { filters.who  = $("filterWho").value;  applyFilterSortRender(); });

  $("colLang").addEventListener("change", () => { shown.lang = $("colLang").checked; saveShownSettings(); rebuildColumnsAndHeader(); applyFilterSortRender(true); });
  $("colLen").addEventListener("change",  () => { shown.len  = $("colLen").checked;  saveShownSettings(); rebuildColumnsAndHeader(); applyFilterSortRender(true); });
  $("colWho").addEventListener("change",  () => { shown.who  = $("colWho").checked;  saveShownSettings(); rebuildColumnsAndHeader(); applyFilterSortRender(true); });
  $("colPage").addEventListener("change", () => { shown.page = $("colPage").checked; saveShownSettings(); rebuildColumnsAndHeader(); applyFilterSortRender(true); });
  $("colBook").addEventListener("change", () => { shown.book = $("colBook").checked; saveShownSettings(); rebuildColumnsAndHeader(); applyFilterSortRender(true); });

  $("viewport").addEventListener("scroll", () => {
    render();
    updateToTopVisible();
  });
  window.addEventListener("scroll", updateToTopVisible);

  window.addEventListener("resize", () => {
    updateDockHeights();
    ROW_H = getRowHPx();
    rebuildColumnsAndHeader();
    render();
    updateToTopVisible();
  });

  $("rows").addEventListener("click", async (e) => {
    const copyBtn = e.target.closest("[data-copy-uid]");
    if(copyBtn){
      e.stopPropagation();
      const uid = Number(copyBtn.getAttribute("data-copy-uid"));
      await copyToClipboard(copyLine[uid] ?? "");
      toast("已複製", base[uid]?.title ? `「${base[uid].title}」` : "");
      return;
    }
    const row = e.target.closest("[data-row-uid]");
    if(row){
      const uid = Number(row.getAttribute("data-row-uid"));
      openModal(uid);
    }
  });

  $("modalClose").addEventListener("click", closeModal);
  $("modalClose2").addEventListener("click", closeModal);
  $("modalBack").addEventListener("click", (e) => {
    if(e.target === $("modalBack")) closeModal();
  });

  document.addEventListener("keydown", (e) => {
    if(e.key === "Escape"){
      if($("modalBack").classList.contains("show")) closeModal();
      if($("settingsBack").classList.contains("show")) closeSettings();
    }
  });
  $("modalCopy").addEventListener("click", async () => {
    const uid = window.__modalUID;
    if(uid == null) return;
    await copyToClipboard(copyLine[uid] ?? "");
    toast("已複製", base[uid]?.title ? `「${base[uid].title}」` : "");
  });
}

// ===== 欄位 / 表頭 / Grid =====
function getActiveCols(){
  const cols = [...COLS_BASE];
  if(shown.lang) cols.push(COLS_EXTRA.find(c=>c.key==="lang"));
  if(shown.len)  cols.push(COLS_EXTRA.find(c=>c.key==="len"));
  if(shown.who)  cols.push(COLS_EXTRA.find(c=>c.key==="who"));
  if(shown.page) cols.push(COLS_EXTRA.find(c=>c.key==="page"));
  if(shown.book) cols.push(COLS_EXTRA.find(c=>c.key==="book"));
  return cols.filter(Boolean);
}

function rebuildColumnsAndHeader(){
  const cols = getActiveCols();

  const parts = cols.map(c => `var(${c.widthVar})`);
  document.documentElement.style.setProperty("--grid", parts.join(" "));

  let minW = 0;
  for(const c of cols){
    const w = measureVarPx(c.widthVar);
    minW += w + 16;
  }
  $("tableMinWidth").style.minWidth = Math.max(420, Math.ceil(minW)) + "px";

  const thead = $("thead");
  let html = "";
  for(const c of cols){
    if(c.key === "copy"){
      html += `<div class="th"></div>`;
      continue;
    }
    const isActive = (sortKey === c.key);
    const mark =
      !isActive ? `<span class="sortMark off">↕</span>` :
      (sortDir === "asc") ? `<span class="sortMark">↑</span>` :
      (sortDir === "desc") ? `<span class="sortMark">↓</span>` :
      `<span class="sortMark off">↕</span>`;

    html += `
      <div class="th sortable" data-sort-key="${c.key}">
        <span>${escapeHtml(c.label)}</span>
        ${mark}
      </div>
    `;
  }
  thead.innerHTML = html;

  thead.onclick = (e) => {
    const el = e.target.closest("[data-sort-key]");
    if(!el) return;
    const key = el.getAttribute("data-sort-key");
    if(sortKey !== key){
      sortKey = key;
      sortDir = "asc";
    }else{
      if(sortDir === "asc") sortDir = "desc";
      else if(sortDir === "desc"){ sortKey = ""; sortDir = ""; }
      else sortDir = "asc";
    }
    rebuildColumnsAndHeader();
    applyFilterSortRender();
  };
}

// ===== 篩選 / 排序 =====
function passDropdownFilters(r){
  if(filters.lang && r.lang !== filters.lang) return false;
  if(filters.len  && r.len  !== filters.len)  return false;
  if(filters.who  && r.who  !== filters.who)  return false;
  return true;
}
function combinedText(r){
  return normalize([r.who, r.id, r.title, r.artist, r.lang, r.page, r.len, r.book].join(" "));
}
function passTextFilter(r){
  const q = normalize($("q").value);
  if(!q) return true;
  const mode = currentMatchMode();
  const t = combinedText(r);
  if(mode === "fuzzy"){
    const tokens = q.split(/\s+/).filter(Boolean);
    for(const tok of tokens){
      if(!t.includes(tok)) return false;
    }
    return true;
  }else{
    return t.includes(q);
  }
}
function getSortVal(r, key){
  if(key === "len") return Number(r.len) || 0;
  if(key === "id") return normalize(r.id);
  if(key === "title") return normalize(r.title);
  if(key === "artist") return normalize(r.artist);
  if(key === "who") return normalize(r.who);
  if(key === "lang") return normalize(r.lang);
  if(key === "page") return normalize(r.page);
  if(key === "book") return normalize(r.book);
  return normalize(r.title);
}

function applyFilterSortRender(keepScroll=false){
  const prevTop = $("viewport").scrollTop;

  const uids = [];
  for(let uid=0; uid<base.length; uid++){
    const r = base[uid];
    if(!passDropdownFilters(r)) continue;
    if(!passTextFilter(r)) continue;
    uids.push(uid);
  }

  if(sortKey && sortDir){
    const sign = (sortDir === "asc") ? 1 : -1;
    uids.sort((a,b)=>{
      const ra = base[a], rb = base[b];
      const va = getSortVal(ra, sortKey);
      const vb = getSortVal(rb, sortKey);

      if(sortKey === "len"){
        return (va - vb) * sign || (a-b);
      }
      if(va < vb) return -1*sign;
      if(va > vb) return  1*sign;
      return (a-b);
    });
  }

  viewUIDs = uids;
  $("countPill").textContent = `共 ${base.length.toLocaleString()} 筆｜顯示 ${viewUIDs.length.toLocaleString()} 筆`;

  updateSpacer();
  render();

  if(keepScroll){
    $("viewport").scrollTop = Math.min(prevTop, Math.max(0, viewUIDs.length*ROW_H - $("viewport").clientHeight));
  }else{
    $("viewport").scrollTop = 0;
  }
  updateToTopVisible();
}

function updateSpacer(){
  $("spacer").style.height = (viewUIDs.length * ROW_H + 8) + "px";
}

// ===== 虛擬渲染 =====
function render(){
  const vp = $("viewport");
  const rows = $("rows");
  const scrollTop = vp.scrollTop;
  const height = vp.clientHeight;

  const start = Math.max(0, Math.floor(scrollTop / ROW_H) - OVERSCAN);
  const end = Math.min(viewUIDs.length, Math.ceil((scrollTop + height) / ROW_H) + OVERSCAN);

  rows.style.transform = `translateY(${start * ROW_H}px)`;

  const cols = getActiveCols();
  let html = "";

  for(let i=start; i<end; i++){
    const uid = viewUIDs[i];
    const r = base[uid];

    const cells = [];
    for(const c of cols){
      if(c.key === "copy"){
        cells.push(`
          <div class="cell copyWrap">
            <button class="copyBtn" title="複製這一筆" data-copy-uid="${uid}">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 9h10v12H9V9Z" stroke="currentColor" stroke-width="1.8" />
                <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" stroke="currentColor" stroke-width="1.8" />
              </svg>
            </button>
          </div>
        `);
        continue;
      }

      const wrapClass = c.wrap2 ? "wrap2" : "";
      if(c.key === "id"){
        cells.push(`<div class="cell ${wrapClass}" title="${escapeHtml(r.id)}">${escapeHtml(r.id)}</div>`);
      }else if(c.key === "title"){
        cells.push(`<div class="cell ${wrapClass}" title="${escapeHtml(r.title)}">${escapeHtml(r.title)}</div>`);
      }else if(c.key === "artist"){
        cells.push(`<div class="cell ${wrapClass}" title="${escapeHtml(r.artist)}">${escapeHtml(r.artist)}</div>`);
      }else if(c.key === "lang"){
        cells.push(`<div class="cell"><span class="tag">${escapeHtml(r.lang)}</span></div>`);
      }else if(c.key === "len"){
        cells.push(`<div class="cell small" title="${escapeHtml(r.len)}">${escapeHtml(r.len)}</div>`);
      }else if(c.key === "who"){
        cells.push(`<div class="cell small" title="${escapeHtml(r.who)}">${escapeHtml(r.who)}</div>`);
      }else if(c.key === "page"){
        cells.push(`<div class="cell small" title="${escapeHtml(r.page)}">${escapeHtml(r.page)}</div>`);
      }else if(c.key === "book"){
        cells.push(`<div class="cell small" title="${escapeHtml(r.book)}">${escapeHtml(r.book)}</div>`);
      }else{
        cells.push(`<div class="cell"></div>`);
      }
    }

    html += `<div class="row" data-row-uid="${uid}">${cells.join("")}</div>`;
  }

  rows.innerHTML = html;
}

// ===== 詳細視窗 =====
function openModal(uid){
  const r = base[uid];
  if(!r) return;
  window.__modalUID = uid;

  $("modalTitle").textContent = r.title ? `詳細資料：${r.title}` : "詳細資料";

  const items = [
    ["編號", r.id],
    ["歌名", r.title],
    ["歌手", r.artist],
    ["語言", r.lang],
    ["字數", r.len],
    ["誰的歌", r.who],
    ["頁數", r.page],
    ["歌本", r.book],
  ];

  let html = "";
  for(const [k,v] of items){
    html += `<div class="k">${escapeHtml(k)}</div><div class="v">${escapeHtml(v || "")}</div>`;
  }
  $("modalBody").innerHTML = html;

  $("modalBack").classList.add("show");
  $("modalBack").setAttribute("aria-hidden","false");
}

function closeModal(){
  $("modalBack").classList.remove("show");
  $("modalBack").setAttribute("aria-hidden","true");
  window.__modalUID = null;
}

// ===== 啟動 =====
init();
</script>
