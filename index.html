<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>二結點歌本速查</title>
  <style>
    :root{
      /* ✅ 全站字體放大 2 倍 */
      font-size: 200%;

      /* ✅ Theme variables (Dark default) */
      --bgTop:#07080b;
      --bgMid:#0b0c10;
      --bgBot:#07080b;

      --bg:#0b0c10; --card:#111318; --text:#e9eef6; --muted:#9aa6b2;
      --line:#232733; --btn:#1c2230; --btn2:#22314a; --accent:#7aa2ff;
      --radius:14px;

      /* ✅ 重要：把關鍵尺寸改成 rem，讓它跟字體同步放大 */
      --ctlH: 2.75rem;
      --ctlPadY: .55rem;
      --ctlPadX: .70rem;

      /* ✅ 虛擬清單列高：改成 rem，字變大列也變大 */
      --rowH: 4.6rem;

      /* 左側複製欄 */
      --copyCol: 3.3rem;

      /* ✅ 三欄固定：10 個數字寬度 */
      --colFixed: 10ch;

      /* 其他欄位 */
      --colLang: 6.5rem;
      --colLen:  5.2rem;
      --colWho:  7.5rem;
      --colPage: 6.0rem;

      /* Grid（JS 會動態改） */
      --grid: var(--copyCol) var(--colFixed) var(--colFixed) var(--colFixed);

      /* ✅ RWD：更小螢幕時，縮窄固定欄位（仍然「像」10 碼寬） */
      --colFixedSm: 8ch;

      /* ✅ 置頂用：由 JS 量測 header 高度後寫入 */
      --headerH: 0px;

      font-synthesis-weight:none;
    }

    /* ✅ Light mode */
    html[data-theme="light"]{
      --bgTop:#f7f8fb;
      --bgMid:#f1f3f7;
      --bgBot:#edf0f5;

      --bg:#f2f4f8;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#475569;
      --line:#d9dee8;

      --btn:#eef2f7;
      --btn2:#e2e8f0;
      --accent:#2b6bff;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:linear-gradient(180deg, var(--bgTop), var(--bgMid) 40%, var(--bgBot));
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      touch-action: pan-x pan-y;
    }

    .wrap{max-width:1100px; margin:16px auto; padding:0 14px;}

    /* ✅ Header：置頂（固定在最上面） */
    header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:8px;               /* ✅ 更緊密 */
      margin-bottom:6px;     /* ✅ 更緊密 */
      flex-wrap:wrap;

      position: sticky;
      top: 0;
      z-index: 6000;

      /* ✅ 更緊密：縮小置頂區上下 padding */
      padding: 10px 0 6px 0;
      background:linear-gradient(180deg, var(--bgTop), var(--bgMid) 40%, var(--bgBot));
      backdrop-filter: blur(10px);
    }

    h1{margin:0; font-size:1.35rem; letter-spacing:.5px}
    .sub{color:var(--muted); font-size:.82rem; margin-top:.20rem} /* ✅ 更緊密 */

    /* ✅ 將「共..筆 顯示..筆」移到下一行 */
    .metaRow{
      flex: 1 1 100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:.45rem;       /* ✅ 更緊密 */
      margin-top:.20rem;/* ✅ 更緊密 */
    }

    .pill{
      font-size:.78rem; color:var(--muted);
      padding:.28rem .55rem; /* ✅ 更緊密 */
      border:1px solid rgba(255,255,255,.08);
      border-radius:999px;
      background:rgba(0,0,0,.18);
      white-space:nowrap;
    }
    html[data-theme="light"] .pill{
      border:1px solid rgba(15,23,42,.12);
      background:rgba(255,255,255,.75);
    }

    .card{
      background:rgba(17,19,24,.85);
      border:1px solid rgba(35,39,51,.9);
      border-radius:var(--radius);
      box-shadow:0 10px 30px rgba(0,0,0,.35);
      overflow:hidden;
      position:relative;
    }
    html[data-theme="light"] .card{
      background:rgba(255,255,255,.85);
      border:1px solid rgba(15,23,42,.10);
      box-shadow:0 10px 30px rgba(15,23,42,.10);
    }

    label{font-size:.78rem; color:var(--muted)}
    select, input{
      background:rgba(0,0,0,.25);
      color:var(--text);
      border:1px solid rgba(255,255,255,.1);
      border-radius:12px;
      padding: var(--ctlPadY) var(--ctlPadX);
      font-size:.95rem;
      outline:none;
      height:var(--ctlH);
      line-height:1.2;
      min-width: 0;
    }
    html[data-theme="light"] select,
    html[data-theme="light"] input{
      background:rgba(255,255,255,.95);
      border:1px solid rgba(15,23,42,.14);
    }

    input{min-width: 12rem;}
    input::placeholder{color:#7e8a96}
    html[data-theme="light"] input::placeholder{color:#64748b}

    .btn{
      background:var(--btn);
      border:1px solid rgba(255,255,255,.08);
      color:var(--text);
      padding: var(--ctlPadY) .85rem;
      border-radius:14px;
      cursor:pointer;
      font-size:.95rem;
      display:inline-flex; align-items:center; gap:.4rem;
      user-select:none;
      transition:.15s transform, .15s background;
      white-space:nowrap;
      height:var(--ctlH);
      line-height:1.2;
      font-weight:800;
      min-width: 0;
    }
    html[data-theme="light"] .btn{ border:1px solid rgba(15,23,42,.12); }
    .btn:hover{background:var(--btn2)}
    .btn:active{transform:translateY(1px)}
    .btn.primary{
      background:rgba(122,162,255,.18);
      border-color:rgba(122,162,255,.45);
    }
    html[data-theme="light"] .btn.primary{
      background:rgba(43,107,255,.14);
      border-color:rgba(43,107,255,.35);
    }

    .iconBtn{
      width:var(--ctlH); height:var(--ctlH);
      padding:0;
      justify-content:center;
      border-radius:14px;
      flex: 0 0 auto;
    }
    .iconBtn svg{width:1.15rem; height:1.15rem}

    .xBtn{
      width:var(--ctlH); height:var(--ctlH);
      padding:0;
      justify-content:center;
      border-radius:14px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      font-weight:900;
      font-size:1.05rem;
      line-height:var(--ctlH);
      flex: 0 0 auto;
    }
    html[data-theme="light"] .xBtn{
      background:rgba(15,23,42,.04);
      border:1px solid rgba(15,23,42,.12);
    }

    /* ✅ 設定按鈕 */
    .settingsBtn{
      width:var(--ctlH); height:var(--ctlH);
      padding:0;
      justify-content:center;
      border-radius:14px;
    }
    .settingsBtn svg{width:1.15rem; height:1.15rem}

    /* ✅ 搜尋列：移到篩選面板的「上方新區塊」並置頂 */
    .filtersTop{
      position: sticky;
      top: var(--headerH);
      z-index: 5500;

      /* ✅ 更緊密 */
      padding: .35rem .5rem;
      border-bottom: 1px solid var(--line);

      background: rgba(0,0,0,.14);
      backdrop-filter: blur(10px);
    }
    html[data-theme="light"] .filtersTop{
      background: rgba(255,255,255,.72);
    }

    .searchRow{
      display:flex;
      align-items:center;
      gap:.45rem;         /* ✅ 更緊密 */
      width:100%;
      flex-wrap: nowrap;
      min-width:0;
    }

    /* ✅ 搜尋至少一半寬度；其他三個平均吃剩下 */
    .searchRow input{
      flex: 3 1 0;       /* 3 / (3+1+1+1) = 50% */
      min-width: 0;
    }
    .searchRow .btn{
      flex: 1 1 0;
      min-width: 0;
      justify-content:center;
      padding-left: 0;    /* ✅ 讓按鈕更像均分格子 */
      padding-right: 0;
    }
    .searchRow .iconBtn,
    .searchRow .xBtn{
      width:auto;
    }

    /* ✅ 篩選區：去掉上方多餘空間（padding 改為 0） */
    .filtersArea{
      padding: 0;                 /* ✅ 去除多餘空間 */
      border-bottom: 1px solid var(--line);
    }

    /* ✅ B：極小的「篩選」收合按鈕 */
    .collapseBtn{
      padding: 0;
      border-radius:12px;
      font-weight:900;
      letter-spacing:.5px;
    }
    .collapseBtn svg{ width:1.15rem; height:1.15rem; transition: .18s transform; }
    .collapseBtn[aria-expanded="false"] svg{ transform: rotate(-90deg); }
    .collapseBtn .t{
      display:none;
    }

    .filtersBody{
      overflow:hidden;
      max-height: 600px;
      transition: max-height .22s ease;

      /* ✅ 把 padding 放到 body 裡，讓頂部更乾淨、也跟收合一起收起來 */
      padding: .35rem .5rem;
    }
    .filtersBody.collapsed{
      max-height: 0px;
      padding-top: 0;
      padding-bottom: 0;
    }

    /* ✅ 篩選列：預設橫排（大螢幕） */
    .filtersRow{
      display:flex;
      gap:.45rem;          /* ✅ 更緊密 */
      flex-wrap:wrap;
      align-items:flex-end;
      justify-content:flex-start;
      min-width: 0;
    }

    .filterItem{
      display:inline-flex;
      align-items:flex-end;
      gap:.35rem;          /* ✅ 更緊密 */
      min-width: 0;
    }
    .filterItem label{white-space:nowrap; line-height:1.1}
    .filterItem select{min-width: 7rem}

    .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .table-min-width{ min-width: 520px; }

    .thead{
      display:grid;
      grid-template-columns: var(--grid);
      padding:.6rem .75rem;
      font-size:.78rem;
      color:var(--muted);
      border-bottom:1px solid var(--line);
      background:rgba(0,0,0,.14);
      user-select:none;
    }
    html[data-theme="light"] .thead{ background:rgba(15,23,42,.04); }

    .th{
      padding:0 .45rem;
      display:flex; align-items:center; gap:.35rem;
      min-width:0;
    }
    .th:first-child{padding-left:.3rem}
    .th.sortable{cursor:pointer}
    .sortMark{font-size:.75rem; opacity:.9}
    .sortMark.off{opacity:.35}

    .viewport{
      height: 70vh;
      overflow:auto;
      position:relative;
    }
    .spacer{height:0px}
    .rows{
      position:absolute; left:0; top:0; right:0;
      padding:0 .75rem .5rem .75rem;
    }

    .row{
      display:grid;
      grid-template-columns: var(--grid);
      align-items:stretch;
      height:var(--rowH);
      border-bottom:1px solid rgba(35,39,51,.7);
      border-radius:10px;
      cursor:pointer;
    }
    html[data-theme="light"] .row{
      border-bottom:1px solid rgba(15,23,42,.10);
    }
    .row:hover{background:rgba(255,255,255,.04)}
    html[data-theme="light"] .row:hover{background:rgba(15,23,42,.04)}

    .cell{
      padding:.45rem .45rem;
      font-size:.9rem;
      min-width:0;
      overflow:hidden;
    }

    .cell.wrap2{
      white-space:normal;
      display:-webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow:hidden;
      line-height:1.25;
    }

    .cell.small{
      font-size:.78rem;
      color:#cdd6e1;
      white-space:nowrap;
      text-overflow:ellipsis;
    }
    html[data-theme="light"] .cell.small{color:#334155}

    .tag{
      display:inline-flex; align-items:center;
      border:1px solid rgba(255,255,255,.12);
      padding:.12rem .45rem; border-radius:999px;
      font-size:.78rem; color:#cdd6e1;
      background:rgba(255,255,255,.06);
      white-space:nowrap;
    }
    html[data-theme="light"] .tag{
      border:1px solid rgba(15,23,42,.12);
      color:#0f172a;
      background:rgba(15,23,42,.04);
    }

    .copyWrap{ display:flex; justify-content:center; align-items:center; }
    .copyBtn{
      width:2.15rem; height:1.85rem;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      color:var(--text);
      cursor:pointer;
      display:inline-flex; align-items:center; justify-content:center;
      transition:.15s transform, .15s background;
      user-select:none;
    }
    html[data-theme="light"] .copyBtn{
      border:1px solid rgba(15,23,42,.12);
      background:rgba(15,23,42,.03);
    }
    .copyBtn svg{width:1.05rem; height:1.05rem; opacity:.9}

    .toast{
      position:fixed; right:14px; bottom:14px;
      background:rgba(17,19,24,.92);
      border:1px solid rgba(255,255,255,.12);
      border-radius:14px;
      padding:.55rem .65rem;
      color:var(--text);
      box-shadow:0 12px 30px rgba(0,0,0,.4);
      display:none;
      max-width:min(520px, calc(100vw - 28px));
      font-size:.85rem;
      z-index:9999;
    }
    html[data-theme="light"] .toast{
      background:rgba(255,255,255,.92);
      border:1px solid rgba(15,23,42,.12);
      box-shadow:0 12px 30px rgba(15,23,42,.14);
    }
    .toast.show{display:block}
    .toast .t{color:var(--muted); font-size:.78rem; margin-top:.2rem}

    /* ✅ (4) 滑動至頂部 */
    .toTop{
      position: fixed;
      right: 14px;
      bottom: 78px;
      z-index: 9998;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: .18s opacity, .18s transform;
    }
    .toTop.show{
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .modalBack{
      position:fixed; inset:0;
      background:rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding:16px;
      z-index:10000;
    }
    html[data-theme="light"] .modalBack{ background:rgba(15,23,42,.35); }
    .modalBack.show{display:flex}

    .modal{
      width:min(720px, 100%);
      background:rgba(17,19,24,.96);
      border:1px solid rgba(255,255,255,.14);
      border-radius:16px;
      box-shadow:0 18px 60px rgba(0,0,0,.55);
      overflow:hidden;
    }
    html[data-theme="light"] .modal{
      background:rgba(255,255,255,.96);
      border:1px solid rgba(15,23,42,.12);
      box-shadow:0 18px 60px rgba(15,23,42,.18);
    }
    .modalHead{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:.65rem .75rem;
      border-bottom:1px solid rgba(255,255,255,.10);
    }
    html[data-theme="light"] .modalHead{ border-bottom:1px solid rgba(15,23,42,.10); }
    .modalTitle{ font-weight:900; font-size:.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .modalClose{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:var(--text);
      border-radius:12px;
      padding:.45rem .55rem;
      cursor:pointer;
      font-size:.85rem;
      height:var(--ctlH);
      display:inline-flex; align-items:center;
    }
    html[data-theme="light"] .modalClose{
      background:rgba(15,23,42,.04);
      border:1px solid rgba(15,23,42,.12);
    }

    .modalBody{
      padding:.65rem .75rem;
      display:grid;
      grid-template-columns: 6.5rem 1fr;
      gap:.5rem .6rem;
      font-size:.9rem;
    }
    .k{color:var(--muted); font-size:.85rem}
    .v{color:var(--text); word-break:break-word}
    .modalFoot{
      padding:.65rem .75rem;
      border-top:1px solid rgba(255,255,255,.10);
      display:flex; gap:.6rem; justify-content:flex-end; flex-wrap:wrap;
    }
    html[data-theme="light"] .modalFoot{ border-top:1px solid rgba(15,23,42,.10); }

    /* ✅ 設定 Modal 的 body */
    .settingsBody{
      padding:.65rem .75rem .8rem .75rem;
      display:block;
      font-size:.9rem;
    }

    .settingsGrid{
      display:flex;
      flex-direction:column;
      gap:.75rem;
    }
    .settingsSection{
      display:flex;
      gap:.75rem;
      flex-wrap:wrap;
      align-items:center;
    }

    .chip{
      display:inline-flex; align-items:center; gap:.45rem;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
      padding:.35rem .6rem;
      border-radius:999px;
      font-size:.78rem;
      cursor:pointer;
      user-select:none;
      white-space:nowrap;
    }
    html[data-theme="light"] .chip{
      border:1px solid rgba(15,23,42,.12);
      background:rgba(255,255,255,.65);
    }
    .chip input{width:1rem; height:1rem; margin:0; accent-color: var(--accent);}

    .chip span{color:#cdd6e1}
    html[data-theme="light"] .chip span{color:#0f172a}

    .radioWrap{
      display:flex;
      align-items:center;
      gap:.7rem;
      padding:.35rem .6rem;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
      border-radius:999px;
      flex-wrap:wrap;
    }
    html[data-theme="light"] .radioWrap{
      border:1px solid rgba(15,23,42,.12);
      background:rgba(255,255,255,.65);
    }
    .radioWrap label{
      display:flex; align-items:center; gap:.45rem;
      color:var(--muted);
      font-size:.85rem;
      cursor:pointer;
      user-select:none;
    }
    .radioWrap input{width:1.05rem; height:1.05rem; accent-color:var(--accent)}

    /* ✅ RWD */
    @media (max-width: 900px){
      .wrap{margin:12px auto; padding:0 12px;}
      header{align-items:flex-start;}
      input{min-width: 10rem}
      .modalBody{grid-template-columns: 5.2rem 1fr}
      :root{ --colFixed: var(--colFixedSm); }
      .table-min-width{min-width: 460px}
    }

    @media (max-width: 520px){
      h1{font-size:1.15rem}
      .sub{font-size:.78rem}

      /* ✅ 等比例縮小（查詢列仍同一列） */
      :root{
        --ctlH: 2.35rem;
        --ctlPadY: .42rem;
        --ctlPadX: .55rem;
      }
      .btn{font-size:.88rem}
      .iconBtn svg{width:1.05rem; height:1.05rem}
      .xBtn{font-size:1.00rem}

      /* ✅ 篩選改垂直排列、且每一行同寬 */
      .filtersRow{
        width:100%;
        flex-direction:column;
        align-items:stretch;
        gap:.45rem; /* ✅ 更緊密 */
      }
      .filterItem{
        width:100%;
        display:flex;
        flex-direction:column;
        align-items:stretch;
        gap:.30rem; /* ✅ 更緊密 */
      }
      .filterItem label{
        font-size:.78rem;
        color:var(--muted);
      }
      .filterItem select{
        width:100%;
        min-width: 0;
      }

      .thead{padding:.55rem .6rem;}
      .rows{padding:0 .6rem .5rem .6rem;}
      .table-min-width{min-width: 420px}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header id="topHeader">
      <div>
        <h1>二結點歌本速查</h1>
        <div class="sub">>Happy Happy</div>
      </div>

      <div class="metaRow">
        <div class="pill" id="countPill">載入中…</div>
        <button class="btn iconBtn settingsBtn" id="btnSettings" title="設定" aria-label="設定">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 15.25a3.25 3.25 0 1 0 0-6.5 3.25 3.25 0 0 0 0 6.5Z" stroke="currentColor" stroke-width="1.8"/>
            <path d="M19.4 13a7.86 7.86 0 0 0 .04-2l1.6-1.2-1.9-3.3-1.9.8a8.2 8.2 0 0 0-1.7-1l-.3-2H9.7l-.3 2a8.2 8.2 0 0 0-1.7 1l-1.9-.8-1.9 3.3 1.6 1.2a7.86 7.86 0 0 0 .04 2L4 14.2l1.9 3.3 1.9-.8c.52.42 1.1.77 1.7 1l.3 2h4.6l.3-2c.6-.23 1.18-.58 1.7-1l1.9.8 1.9-3.3-1.6-1.2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="card">
      <!-- ✅ 篩選區（內含：搜尋上方新面板 + 下拉篩選） -->
      <div class="filtersArea" id="filtersArea">
        <!-- ✅ 新增：篩選面板上方的搜尋區塊（置頂） -->
        <div class="filtersTop" id="filtersTop">
          <div class="searchRow">
            <input id="q" placeholder="查詢（點🔍）" />

            <button class="btn primary" id="btnFilter" title="套用文字查詢" aria-label="套用文字查詢">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" style="width:1.15rem;height:1.15rem">
                <path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="1.8"/>
                <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </button>

            <button class="btn xBtn" id="btnClearFilters" title="取消篩選/清空" aria-label="取消篩選">×</button>

            <button class="btn collapseBtn" id="btnToggleFilters" aria-expanded="true" title="收合/展開篩選" aria-label="收合/展開篩選">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M8 10l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span class="t">篩選</span>
            </button>
          </div>
        </div>

        <!-- ✅ 下拉篩選（可收合） -->
        <div class="filtersBody" id="filtersBody">
          <div class="filtersRow">
            <div class="filterItem">
              <label for="filterLang">語言</label>
              <select id="filterLang"></select>
            </div>

            <div class="filterItem">
              <label for="filterLen">字數</label>
              <select id="filterLen"></select>
            </div>

            <div class="filterItem">
              <label for="filterWho">誰的歌</label>
              <select id="filterWho"></select>
            </div>
          </div>
        </div>
      </div>

      <div class="table-scroll" id="tableScroll">
        <div class="table-min-width" id="tableMinWidth">
          <div class="thead" id="thead"></div>

          <div class="viewport" id="viewport">
            <div class="spacer" id="spacer"></div>
            <div class="rows" id="rows"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ✅ (4) 滑動至頂部 -->
  <button class="btn iconBtn toTop" id="btnToTop" title="滑到頂部" aria-label="滑到頂部">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 5l7 7M12 5L5 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 5v14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>

  <div class="toast" id="toast">
    <div id="toastMsg">OK</div>
    <div class="t" id="toastSub"></div>
  </div>

  <!-- 詳細資料 modal -->
  <div class="modalBack" id="modalBack" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal">
      <div class="modalHead">
        <div class="modalTitle" id="modalTitle">詳細資料</div>
        <button class="modalClose" id="modalClose">關閉</button>
      </div>
      <div class="modalBody" id="modalBody"></div>
      <div class="modalFoot">
        <button class="btn" id="modalCopy">📋 複製這一筆</button>
        <button class="btn" id="modalClose2">關閉</button>
      </div>
    </div>
  </div>

  <!-- ✅ 設定 modal -->
  <div class="modalBack" id="settingsBack" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal" style="width:min(760px, 100%);">
      <div class="modalHead">
        <div class="modalTitle">設定</div>
        <button class="modalClose" id="settingsClose">關閉</button>
      </div>

      <div class="settingsBody">
        <div class="settingsGrid">

          <div class="settingsSection">
            <span style="color:var(--muted); font-size:.85rem;">顯示欄位：</span>
            <label class="chip"><input type="checkbox" id="colLang" /><span>語言</span></label>
            <label class="chip"><input type="checkbox" id="colLen" /><span>字數</span></label>
            <label class="chip"><input type="checkbox" id="colWho" /><span>誰的歌</span></label>
            <label class="chip"><input type="checkbox" id="colPage" /><span>頁數</span></label>
            <label class="chip"><input type="checkbox" id="colBook" /><span>歌本</span></label>
          </div>

          <div class="settingsSection">
            <span style="color:var(--muted); font-size:.85rem;">比對方式：</span>
            <div class="radioWrap" role="group" aria-label="比對方式">
              <label>
                <input type="radio" name="matchMode" id="modeFuzzy" value="fuzzy" checked>
                <span>模糊比對</span>
              </label>
              <label>
                <input type="radio" name="matchMode" id="modeExact" value="exact">
                <span>精準比對</span>
              </label>
            </div>
          </div>

          <div class="settingsSection">
            <label class="chip" title="切換淺色模式（會記住）">
              <input type="checkbox" id="toggleLight" />
              <span>淺色模式</span>
            </label>
          </div>

          <div style="color:var(--muted); font-size:.78rem; line-height:1.35;">
            小提醒：欄位變更／主題切換會自動重算表格寬度與列高，避免卡頓與跑版。
          </div>
        </div>
      </div>

      <div class="modalFoot">
        <button class="btn primary" id="settingsDone">完成</button>
      </div>
    </div>
  </div>

  <script src="./songs.js"></script>

  <script>
  ;(() => {
    "use strict";

    // =========================
    // 0) Boot guard
    // =========================
    if (!window.SONGS || !Array.isArray(window.SONGS)) {
      alert("songs.js 載入失敗，請確認檔案存在");
      throw new Error("SONGS not found");
    }

    // =========================
    // 1) Constants / Schema
    // =========================
    const SONGS = window.SONGS;

    const KEYS = Object.freeze({
      THEME: "songbook_theme",
      SHOWN: "songbook_shown_cols_v2",
    });

    const LIMITS = Object.freeze({
      MAX_OPTIONS: 250,
      OVERSCAN: 10,
      TO_TOP_SHOW_AT: 220,
      TOAST_MS: 2000,
    });

    const COLS_BASE = Object.freeze([
      { key:"copy",   label:"",   sortable:false, widthVar:"--copyCol" },
      { key:"id",     label:"編號", sortable:true,  widthVar:"--colFixed", wrap2:true },
      { key:"title",  label:"歌名", sortable:true,  widthVar:"--colFixed", wrap2:true },
      { key:"artist", label:"歌手", sortable:true,  widthVar:"--colFixed", wrap2:true },
    ]);

    const COLS_EXTRA = Object.freeze([
      { key:"lang", label:"語言",  sortable:true, widthVar:"--colLang" },
      { key:"len",  label:"字數",  sortable:true, widthVar:"--colLen" },
      { key:"who",  label:"誰的歌", sortable:true, widthVar:"--colWho" },
      { key:"page", label:"頁數",  sortable:true, widthVar:"--colPage" },
      { key:"book", label:"歌本",  sortable:true, widthVar:"--colWho" },
    ]);

    // =========================
    // 2) DOM helpers (UI layer)
    // =========================
    const UI = (() => {
      const $ = (id) => document.getElementById(id);

      const els = Object.freeze({
        topHeader: $("topHeader"),
        countPill: $("countPill"),
        thead: $("thead"),
        viewport: $("viewport"),
        spacer: $("spacer"),
        rows: $("rows"),
        tableMinWidth: $("tableMinWidth"),

        q: $("q"),
        btnFilter: $("btnFilter"),
        btnClearFilters: $("btnClearFilters"),

        filterLang: $("filterLang"),
        filterLen: $("filterLen"),
        filterWho: $("filterWho"),

        btnToggleFilters: $("btnToggleFilters"),
        filtersBody: $("filtersBody"),

        btnToTop: $("btnToTop"),

        toast: $("toast"),
        toastMsg: $("toastMsg"),
        toastSub: $("toastSub"),

        // modals
        modalBack: $("modalBack"),
        modalTitle: $("modalTitle"),
        modalBody: $("modalBody"),
        modalClose: $("modalClose"),
        modalClose2: $("modalClose2"),
        modalCopy: $("modalCopy"),

        // settings modal
        btnSettings: $("btnSettings"),
        settingsBack: $("settingsBack"),
        settingsClose: $("settingsClose"),
        settingsDone: $("settingsDone"),

        toggleLight: $("toggleLight"),
        colLang: $("colLang"),
        colLen: $("colLen"),
        colWho: $("colWho"),
        colPage: $("colPage"),
        colBook: $("colBook"),
      });

      const toast = (msg, sub="") => {
        els.toastMsg.textContent = msg;
        els.toastSub.textContent = sub;
        els.toast.classList.add("show");
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(() => els.toast.classList.remove("show"), LIMITS.TOAST_MS);
      };

      const escapeHtml = (s) => (s ?? "").toString()
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

      const normalize = (s) => (s ?? "").toString().toLowerCase().trim();

      return { $, els, toast, escapeHtml, normalize };
    })();

    // =========================
    // 3) Storage (persistence)
    // =========================
    const Storage = (() => {
      const safeGet = (k, fallback=null) => {
        try { return localStorage.getItem(k) ?? fallback; } catch(_) { return fallback; }
      };
      const safeSet = (k, v) => {
        try { localStorage.setItem(k, v); } catch(_) {}
      };
      const safeGetJSON = (k, fallback=null) => {
        try {
          const raw = localStorage.getItem(k);
          if(!raw) return fallback;
          return JSON.parse(raw);
        } catch(_) { return fallback; }
      };
      const safeSetJSON = (k, obj) => {
        try { localStorage.setItem(k, JSON.stringify(obj)); } catch(_) {}
      };
      return { safeGet, safeSet, safeGetJSON, safeSetJSON };
    })();

    // =========================
    // 4) Theme service
    // =========================
    const Theme = (() => {
      const apply = (theme) => {
        if(theme === "light") document.documentElement.setAttribute("data-theme","light");
        else document.documentElement.removeAttribute("data-theme");
        Storage.safeSet(KEYS.THEME, theme);
      };
      const read = () => Storage.safeGet(KEYS.THEME, "dark") || "dark";
      return { apply, read };
    })();

    // =========================
    // 5) Metrics (CSS var -> px, docking height)
    // =========================
    const Metrics = (() => {
      const measureCssVarPx = (varName) => {
        const raw = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
        const probe = document.createElement("div");
        probe.style.position = "absolute";
        probe.style.left = "-99999px";
        probe.style.width = raw;
        document.body.appendChild(probe);
        const px = probe.getBoundingClientRect().width;
        document.body.removeChild(probe);
        return px;
      };

      const getRowHPx = () => {
        const v = getComputedStyle(document.documentElement).getPropertyValue("--rowH").trim();
        const probe = document.createElement("div");
        probe.style.position = "absolute";
        probe.style.left = "-99999px";
        probe.style.width = v;
        document.body.appendChild(probe);
        const px = probe.getBoundingClientRect().width;
        document.body.removeChild(probe);
        return Math.max(24, Math.round(px));
      };

      const updateDockHeights = () => {
        const h = UI.els.topHeader?.offsetHeight || 0;
        document.documentElement.style.setProperty("--headerH", h + "px");
      };

      return { measureCssVarPx, getRowHPx, updateDockHeights };
    })();

    // =========================
    // 6) Clipboard
    // =========================
    const Clipboard = (() => {
      const copy = async (text) => {
        try {
          await navigator.clipboard.writeText(text);
        } catch(_) {
          const ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
        }
      };
      return { copy };
    })();

    // =========================
    // 7) App State (single source of truth)
    // =========================
    const State = {
      base: [],
      copyLine: [],
      viewUIDs: [],
      sortKey: "",
      sortDir: "",
      filters: { lang:"", len:"", who:"" },
      shown: { lang:false, len:false, who:false, page:false, book:false },
      filtersCollapsed: false,
      ROW_H: 72,
      modalUID: null,
    };

    // =========================
    // 8) Data preparation
    // =========================
    const Data = (() => {
      const normalizeRow = (r) => ({
        who: (r.who ?? "").toString().trim(),
        id: (r.id ?? "").toString().trim(),
        title: (r.title ?? "").toString().trim(),
        artist: (r.artist ?? "").toString().trim(),
        lang: (r.lang ?? "").toString().trim(),
        page: (r.page ?? "").toString().trim(),
        len: (r.len ?? "").toString().trim(),
        book: ((r.book ?? r.songbook ?? r.bookName ?? "")).toString().trim(),
      });

      const build = () => {
        State.base = SONGS.map(normalizeRow);
        State.copyLine = State.base.map(r => [r.who,r.id,r.title,r.artist,r.lang,r.page,r.len,r.book].filter(x => x !== "").join("\t"));
      };

      return { build };
    })();

    // =========================
    // 9) Filters / Options
    // =========================
    const FilterOptions = (() => {
      const uniqueValues = (key) => {
        const set = new Set();
        for(const r of State.base){
          const v = (r[key] ?? "").toString().trim();
          if(v) set.add(v);
        }
        return Array.from(set);
      };

      const setSelectOptions = (selectEl, values, placeholder="全部") => {
        selectEl.innerHTML = "";
        selectEl.appendChild(new Option(placeholder, ""));
        if(values.length > LIMITS.MAX_OPTIONS){
          const opt = new Option(`（選項太多：${values.length}）`, "");
          opt.disabled = true;
          selectEl.appendChild(opt);
          return;
        }
        for(const v of values) selectEl.appendChild(new Option(v, v));
      };

      const build = () => {
        const langs = uniqueValues("lang").sort((a,b)=>a.localeCompare(b, "zh-Hant"));
        const whos  = uniqueValues("who").sort((a,b)=>a.localeCompare(b, "zh-Hant"));
        const lens  = uniqueValues("len").sort((a,b)=> (Number(a)||0) - (Number(b)||0));
        setSelectOptions(UI.els.filterLang, langs, "全部");
        setSelectOptions(UI.els.filterLen,  lens,  "全部");
        setSelectOptions(UI.els.filterWho,  whos,  "全部");
      };

      return { build };
    })();

    // =========================
    // 10) Column config / Header / Grid
    // =========================
    const Columns = (() => {
      const loadShown = () => {
        const obj = Storage.safeGetJSON(KEYS.SHOWN, null);
        if(obj && typeof obj === "object"){
          for(const k of ["lang","len","who","page","book"]){
            if(typeof obj[k] === "boolean") State.shown[k] = obj[k];
          }
        }
      };

      const saveShown = () => Storage.safeSetJSON(KEYS.SHOWN, State.shown);

      const getActiveCols = () => {
        const cols = [...COLS_BASE];
        if(State.shown.lang) cols.push(COLS_EXTRA.find(c=>c.key==="lang"));
        if(State.shown.len)  cols.push(COLS_EXTRA.find(c=>c.key==="len"));
        if(State.shown.who)  cols.push(COLS_EXTRA.find(c=>c.key==="who"));
        if(State.shown.page) cols.push(COLS_EXTRA.find(c=>c.key==="page"));
        if(State.shown.book) cols.push(COLS_EXTRA.find(c=>c.key==="book"));
        return cols.filter(Boolean);
      };

      const setGridCssVar = (cols) => {
        const parts = cols.map(c => `var(${c.widthVar})`);
        document.documentElement.style.setProperty("--grid", parts.join(" "));
      };

      const setMinWidth = (cols) => {
        let minW = 0;
        for(const c of cols){
          const w = Metrics.measureCssVarPx(c.widthVar);
          minW += w + 16;
        }
        UI.els.tableMinWidth.style.minWidth = Math.max(420, Math.ceil(minW)) + "px";
      };

      const buildHeader = (cols) => {
        const { escapeHtml } = UI;
        let html = "";
        for(const c of cols){
          if(c.key === "copy"){
            html += `<div class="th"></div>`;
            continue;
          }
          const isActive = (State.sortKey === c.key);
          const mark =
            !isActive ? `<span class="sortMark off">↕</span>` :
            (State.sortDir === "asc") ? `<span class="sortMark">↑</span>` :
            (State.sortDir === "desc") ? `<span class="sortMark">↓</span>` :
            `<span class="sortMark off">↕</span>`;

          html += `
            <div class="th sortable" data-sort-key="${c.key}">
              <span>${escapeHtml(c.label)}</span>
              ${mark}
            </div>
          `;
        }
        UI.els.thead.innerHTML = html;
      };

      const rebuild = () => {
        const cols = getActiveCols();
        setGridCssVar(cols);
        setMinWidth(cols);
        buildHeader(cols);
      };

      const toggleSort = (key) => {
        if(State.sortKey !== key){
          State.sortKey = key;
          State.sortDir = "asc";
        }else{
          if(State.sortDir === "asc") State.sortDir = "desc";
          else if(State.sortDir === "desc"){ State.sortKey = ""; State.sortDir = ""; }
          else State.sortDir = "asc";
        }
      };

      return { loadShown, saveShown, getActiveCols, rebuild, toggleSort };
    })();

    // =========================
    // 11) Query / Sort logic
    // =========================
    const Query = (() => {
      const currentMatchMode = () =>
        document.querySelector('input[name="matchMode"]:checked')?.value || "fuzzy";

      const passDropdownFilters = (r) => {
        const f = State.filters;
        if(f.lang && r.lang !== f.lang) return false;
        if(f.len  && r.len  !== f.len)  return false;
        if(f.who  && r.who  !== f.who)  return false;
        return true;
      };

      const combinedText = (r) => UI.normalize([r.who, r.id, r.title, r.artist, r.lang, r.page, r.len, r.book].join(" "));

      const passTextFilter = (r) => {
        const q = UI.normalize(UI.els.q.value);
        if(!q) return true;
        const mode = currentMatchMode();
        const t = combinedText(r);

        if(mode === "fuzzy"){
          const tokens = q.split(/\s+/).filter(Boolean);
          for(const tok of tokens){
            if(!t.includes(tok)) return false;
          }
          return true;
        }
        return t.includes(q);
      };

      const getSortVal = (r, key) => {
        if(key === "len") return Number(r.len) || 0;
        if(key === "id") return UI.normalize(r.id);
        if(key === "title") return UI.normalize(r.title);
        if(key === "artist") return UI.normalize(r.artist);
        if(key === "who") return UI.normalize(r.who);
        if(key === "lang") return UI.normalize(r.lang);
        if(key === "page") return UI.normalize(r.page);
        if(key === "book") return UI.normalize(r.book);
        return UI.normalize(r.title);
      };

      const apply = (keepScroll=false) => {
        const prevTop = UI.els.viewport.scrollTop;

        const uids = [];
        for(let uid=0; uid<State.base.length; uid++){
          const r = State.base[uid];
          if(!passDropdownFilters(r)) continue;
          if(!passTextFilter(r)) continue;
          uids.push(uid);
        }

        if(State.sortKey && State.sortDir){
          const sign = (State.sortDir === "asc") ? 1 : -1;
          const k = State.sortKey;
          uids.sort((a,b) => {
            const ra = State.base[a], rb = State.base[b];
            const va = getSortVal(ra, k);
            const vb = getSortVal(rb, k);

            if(k === "len"){
              return (va - vb) * sign || (a-b);
            }
            if(va < vb) return -1 * sign;
            if(va > vb) return  1 * sign;
            return (a-b);
          });
        }

        State.viewUIDs = uids;
        UI.els.countPill.textContent =
          `共 ${State.base.length.toLocaleString()} 筆｜顯示 ${State.viewUIDs.length.toLocaleString()} 筆`;

        VirtualList.updateSpacer();
        VirtualList.render();

        if(keepScroll){
          UI.els.viewport.scrollTop = Math.min(
            prevTop,
            Math.max(0, State.viewUIDs.length * State.ROW_H - UI.els.viewport.clientHeight)
          );
        }else{
          UI.els.viewport.scrollTop = 0;
        }

        UX.updateToTopVisible();
      };

      return { apply };
    })();

    // =========================
    // 12) Virtual list renderer
    // =========================
    const VirtualList = (() => {
      const updateSpacer = () => {
        UI.els.spacer.style.height = (State.viewUIDs.length * State.ROW_H + 8) + "px";
      };

      const render = () => {
        const vp = UI.els.viewport;
        const rowsEl = UI.els.rows;

        const scrollTop = vp.scrollTop;
        const height = vp.clientHeight;

        const start = Math.max(0, Math.floor(scrollTop / State.ROW_H) - LIMITS.OVERSCAN);
        const end = Math.min(State.viewUIDs.length, Math.ceil((scrollTop + height) / State.ROW_H) + LIMITS.OVERSCAN);

        rowsEl.style.transform = `translateY(${start * State.ROW_H}px)`;

        const cols = Columns.getActiveCols();
        const { escapeHtml } = UI;

        let html = "";
        for(let i=start; i<end; i++){
          const uid = State.viewUIDs[i];
          const r = State.base[uid];

          const cells = [];
          for(const c of cols){
            if(c.key === "copy"){
              cells.push(`
                <div class="cell copyWrap">
                  <button class="copyBtn" title="複製這一筆" data-copy-uid="${uid}">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <path d="M9 9h10v12H9V9Z" stroke="currentColor" stroke-width="1.8" />
                      <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" stroke="currentColor" stroke-width="1.8" />
                    </svg>
                  </button>
                </div>
              `);
              continue;
            }

            const wrapClass = c.wrap2 ? "wrap2" : "";
            if(c.key === "id"){
              cells.push(`<div class="cell ${wrapClass}" title="${escapeHtml(r.id)}">${escapeHtml(r.id)}</div>`);
            }else if(c.key === "title"){
              cells.push(`<div class="cell ${wrapClass}" title="${escapeHtml(r.title)}">${escapeHtml(r.title)}</div>`);
            }else if(c.key === "artist"){
              cells.push(`<div class="cell ${wrapClass}" title="${escapeHtml(r.artist)}">${escapeHtml(r.artist)}</div>`);
            }else if(c.key === "lang"){
              cells.push(`<div class="cell"><span class="tag">${escapeHtml(r.lang)}</span></div>`);
            }else if(c.key === "len"){
              cells.push(`<div class="cell small" title="${escapeHtml(r.len)}">${escapeHtml(r.len)}</div>`);
            }else if(c.key === "who"){
              cells.push(`<div class="cell small" title="${escapeHtml(r.who)}">${escapeHtml(r.who)}</div>`);
            }else if(c.key === "page"){
              cells.push(`<div class="cell small" title="${escapeHtml(r.page)}">${escapeHtml(r.page)}</div>`);
            }else if(c.key === "book"){
              cells.push(`<div class="cell small" title="${escapeHtml(r.book)}">${escapeHtml(r.book)}</div>`);
            }else{
              cells.push(`<div class="cell"></div>`);
            }
          }

          html += `<div class="row" data-row-uid="${uid}">${cells.join("")}</div>`;
        }

        rowsEl.innerHTML = html;
      };

      return { updateSpacer, render };
    })();

    // =========================
    // 13) Modals
    // =========================
    const Modal = (() => {
      const openDetail = (uid) => {
        const r = State.base[uid];
        if(!r) return;
        State.modalUID = uid;

        UI.els.modalTitle.textContent = r.title ? `詳細資料：${r.title}` : "詳細資料";

        const items = [
          ["編號", r.id],
          ["歌名", r.title],
          ["歌手", r.artist],
          ["語言", r.lang],
          ["字數", r.len],
          ["誰的歌", r.who],
          ["頁數", r.page],
          ["歌本", r.book],
        ];

        let html = "";
        for(const [k,v] of items){
          html += `<div class="k">${UI.escapeHtml(k)}</div><div class="v">${UI.escapeHtml(v || "")}</div>`;
        }
        UI.els.modalBody.innerHTML = html;

        UI.els.modalBack.classList.add("show");
        UI.els.modalBack.setAttribute("aria-hidden","false");
      };

      const closeDetail = () => {
        UI.els.modalBack.classList.remove("show");
        UI.els.modalBack.setAttribute("aria-hidden","true");
        State.modalUID = null;
      };

      const openSettings = () => {
        UI.els.settingsBack.classList.add("show");
        UI.els.settingsBack.setAttribute("aria-hidden","false");
      };

      const closeSettings = () => {
        UI.els.settingsBack.classList.remove("show");
        UI.els.settingsBack.setAttribute("aria-hidden","true");
      };

      return { openDetail, closeDetail, openSettings, closeSettings };
    })();

    // =========================
    // 14) UX helpers (collapse + toTop)
    // =========================
    const UX = (() => {
      const setFiltersCollapsed = (collapsed) => {
        State.filtersCollapsed = !!collapsed;
        UI.els.btnToggleFilters.setAttribute("aria-expanded", (!State.filtersCollapsed).toString());
        UI.els.filtersBody.classList.toggle("collapsed", State.filtersCollapsed);
      };

      const toggleFilters = () => {
        setFiltersCollapsed(!State.filtersCollapsed);
      };

      const scrollToTop = () => {
        UI.els.viewport?.scrollTo({ top: 0, behavior: "smooth" });
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const updateToTopVisible = () => {
        const vp = UI.els.viewport;
        const show = (vp && vp.scrollTop > LIMITS.TO_TOP_SHOW_AT) || window.scrollY > LIMITS.TO_TOP_SHOW_AT;
        UI.els.btnToTop.classList.toggle("show", !!show);
      };

      return { setFiltersCollapsed, toggleFilters, scrollToTop, updateToTopVisible };
    })();

    // =========================
    // 15) Settings sync (UI <-> State)
    // =========================
    const Settings = (() => {
      const syncToUI = () => {
        const theme = Theme.read();
        UI.els.toggleLight.checked = (theme === "light");

        UI.els.colLang.checked = State.shown.lang;
        UI.els.colLen.checked  = State.shown.len;
        UI.els.colWho.checked  = State.shown.who;
        UI.els.colPage.checked = State.shown.page;
        UI.els.colBook.checked = State.shown.book;
      };

      const handleThemeToggle = () => {
        Theme.apply(UI.els.toggleLight.checked ? "light" : "dark");
        Metrics.updateDockHeights();
        State.ROW_H = Metrics.getRowHPx();
        Columns.rebuild();
        Query.apply(true);
        UI.toast(UI.els.toggleLight.checked ? "已切換淺色模式" : "已切換深色模式");
      };

      const handleShownToggle = (key, checked) => {
        State.shown[key] = !!checked;
        Columns.saveShown();
        Columns.rebuild();
        Query.apply(true);
      };

      return { syncToUI, handleThemeToggle, handleShownToggle };
    })();

    // =========================
    // 16) Event bindings
    // =========================
    const Events = (() => {
      const bind = () => {
        // settings modal
        UI.els.btnSettings.addEventListener("click", Modal.openSettings);
        UI.els.settingsClose.addEventListener("click", Modal.closeSettings);
        UI.els.settingsDone.addEventListener("click", Modal.closeSettings);
        UI.els.settingsBack.addEventListener("click", (e) => {
          if(e.target === UI.els.settingsBack) Modal.closeSettings();
        });

        // theme
        UI.els.toggleLight.addEventListener("change", Settings.handleThemeToggle);

        // filter collapse
        UI.els.btnToggleFilters.addEventListener("click", () => {
          UX.toggleFilters();
          UI.toast(State.filtersCollapsed ? "已收合篩選" : "已展開篩選");
        });

        // to top
        UI.els.btnToTop.addEventListener("click", UX.scrollToTop);

        // query input
        UI.els.q.addEventListener("keydown", (e) => {
          if(e.key === "Enter"){
            Query.apply();
            UI.toast("已套用文字查詢", `顯示 ${State.viewUIDs.length.toLocaleString()} 筆`);
          }else if(e.key === "Escape"){
            UI.els.q.value = "";
            UI.toast("已清空文字輸入", "（不自動篩選）");
          }
        });
        UI.els.btnFilter.addEventListener("click", () => {
          Query.apply();
          UI.toast("已套用篩選", `顯示 ${State.viewUIDs.length.toLocaleString()} 筆`);
        });

        // clear
        UI.els.btnClearFilters.addEventListener("click", () => {
          UI.els.q.value = "";
          State.filters.lang = State.filters.len = State.filters.who = "";
          UI.els.filterLang.value = "";
          UI.els.filterLen.value = "";
          UI.els.filterWho.value = "";
          State.sortKey = ""; State.sortDir = "";
          Columns.rebuild();
          Query.apply();
          UI.toast("已清空", "文字/下拉/排序 已重置");
        });

        // dropdown filters
        UI.els.filterLang.addEventListener("change", () => { State.filters.lang = UI.els.filterLang.value; Query.apply(); });
        UI.els.filterLen.addEventListener("change",  () => { State.filters.len  = UI.els.filterLen.value;  Query.apply(); });
        UI.els.filterWho.addEventListener("change",  () => { State.filters.who  = UI.els.filterWho.value;  Query.apply(); });

        // shown columns
        UI.els.colLang.addEventListener("change", () => Settings.handleShownToggle("lang", UI.els.colLang.checked));
        UI.els.colLen.addEventListener("change",  () => Settings.handleShownToggle("len",  UI.els.colLen.checked));
        UI.els.colWho.addEventListener("change",  () => Settings.handleShownToggle("who",  UI.els.colWho.checked));
        UI.els.colPage.addEventListener("change", () => Settings.handleShownToggle("page", UI.els.colPage.checked));
        UI.els.colBook.addEventListener("change", () => Settings.handleShownToggle("book", UI.els.colBook.checked));

        // sorting header (event delegation)
        UI.els.thead.addEventListener("click", (e) => {
          const el = e.target.closest("[data-sort-key]");
          if(!el) return;
          const key = el.getAttribute("data-sort-key");
          Columns.toggleSort(key);
          Columns.rebuild();
          Query.apply();
        });

        // virtual scroll
        UI.els.viewport.addEventListener("scroll", () => {
          VirtualList.render();
          UX.updateToTopVisible();
        });
        window.addEventListener("scroll", UX.updateToTopVisible);

        // resize
        window.addEventListener("resize", () => {
          Metrics.updateDockHeights();
          State.ROW_H = Metrics.getRowHPx();
          Columns.rebuild();
          VirtualList.render();
          UX.updateToTopVisible();
        });

        // row click / copy click (event delegation)
        UI.els.rows.addEventListener("click", async (e) => {
          const copyBtn = e.target.closest("[data-copy-uid]");
          if(copyBtn){
            e.stopPropagation();
            const uid = Number(copyBtn.getAttribute("data-copy-uid"));
            await Clipboard.copy(State.copyLine[uid] ?? "");
            UI.toast("已複製", State.base[uid]?.title ? `「${State.base[uid].title}」` : "");
            return;
          }
          const row = e.target.closest("[data-row-uid]");
          if(row){
            const uid = Number(row.getAttribute("data-row-uid"));
            Modal.openDetail(uid);
          }
        });

        // detail modal close
        UI.els.modalClose.addEventListener("click", Modal.closeDetail);
        UI.els.modalClose2.addEventListener("click", Modal.closeDetail);
        UI.els.modalBack.addEventListener("click", (e) => {
          if(e.target === UI.els.modalBack) Modal.closeDetail();
        });

        // ESC closes modal(s)
        document.addEventListener("keydown", (e) => {
          if(e.key !== "Escape") return;
          if(UI.els.modalBack.classList.contains("show")) Modal.closeDetail();
          if(UI.els.settingsBack.classList.contains("show")) Modal.closeSettings();
        });

        // detail modal copy
        UI.els.modalCopy.addEventListener("click", async () => {
          const uid = State.modalUID;
          if(uid == null) return;
          await Clipboard.copy(State.copyLine[uid] ?? "");
          UI.toast("已複製", State.base[uid]?.title ? `「${State.base[uid].title}」` : "");
        });
      };

      return { bind };
    })();

    // =========================
    // 17) App bootstrap
    // =========================
    const App = (() => {
      const init = () => {
        // theme first (affects metrics)
        Theme.apply(Theme.read());

        // metrics
        Metrics.updateDockHeights();
        State.ROW_H = Metrics.getRowHPx();

        // state persistence
        Columns.loadShown();

        // sync settings UI
        Settings.syncToUI();

        // data
        Data.build();

        // filters dropdown options
        FilterOptions.build();

        // default expanded filters
        UX.setFiltersCollapsed(false);

        // columns + header
        Columns.rebuild();

        // bind events
        Events.bind();

        // first render
        Query.apply(true);
        UX.updateToTopVisible();
      };

      return { init };
    })();

    // go
    App.init();
  })();
  </script>
</body>
</html>
