<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>二結點歌本速查</title>
  <style>
    :root{
      /* ✅ 全站字體放大 2 倍 */
      font-size: 200%;

      /* ✅ Theme variables (Dark default) */
      --bgTop:#07080b;
      --bgMid:#0b0c10;
      --bgBot:#07080b;

      --bg:#0b0c10; --card:#111318; --text:#e9eef6; --muted:#9aa6b2;
      --line:#232733; --btn:#1c2230; --btn2:#22314a; --accent:#7aa2ff;
      --radius:14px;

      /* ✅ 重要：把關鍵尺寸改成 rem，讓它跟字體同步放大 */
      --ctlH: 2.75rem;
      --ctlPadY: .55rem;
      --ctlPadX: .70rem;

      /* ✅ 虛擬清單列高：改成 rem，字變大列也變大 */
      --rowH: 4.6rem;

      /* 左側複製欄 */
      --copyCol: 3.3rem;

      /* ✅ 三欄固定：10 個數字寬度 */
      --colFixed: 10ch;

      /* 其他欄位 */
      --colLang: 6.5rem;
      --colLen:  5.2rem;
      --colWho:  7.5rem;
      --colPage: 6.0rem;

      /* Grid（JS 會動態改） */
      --grid: var(--copyCol) var(--colFixed) var(--colFixed) var(--colFixed);

      /* ✅ RWD：更小螢幕時，縮窄固定欄位（仍然「像」10 碼寬） */
      --colFixedSm: 8ch;

      font-synthesis-weight:none;
    }

    /* ✅ Light mode */
    html[data-theme="light"]{
      --bgTop:#f7f8fb;
      --bgMid:#f1f3f7;
      --bgBot:#edf0f5;

      --bg:#f2f4f8;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#475569;
      --line:#d9dee8;

      --btn:#eef2f7;
      --btn2:#e2e8f0;
      --accent:#2b6bff;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:linear-gradient(180deg, var(--bgTop), var(--bgMid) 40%, var(--bgBot));
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      touch-action: pan-x pan-y;
    }

    .wrap{max-width:1100px; margin:16px auto; padding:0 14px;}

    /* ✅ Header：置頂（固定在最上面） */
    header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:8px;
      margin-bottom:6px;
      flex-wrap:wrap;

      position: sticky;
      top: 0;
      z-index: 6000;

      padding: 10px 0 6px 0;
      background:linear-gradient(180deg, var(--bgTop), var(--bgMid) 40%, var(--bgBot));
      backdrop-filter: blur(10px);
    }

    h1{margin:0; font-size:1.35rem; letter-spacing:.5px}
    .sub{color:var(--muted); font-size:.82rem; margin-top:.20rem}

    /* ✅ 標題列：左側只放標題 */
    .titleRow{
      display:flex;
      align-items:center;
      gap:.5rem;
      flex-wrap:wrap;
    }

    /* ✅ 將「共..筆 顯示..筆」移到下一行 */
    .metaRow{
      flex: 1 1 100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:.45rem;
      margin-top:.20rem;
    }

    .pill{
      font-size:.78rem; color:var(--muted);
      padding:.28rem .55rem;
      border:1px solid rgba(255,255,255,.08);
      border-radius:999px;
      background:rgba(0,0,0,.18);
      white-space:nowrap;
    }
    html[data-theme="light"] .pill{
      border:1px solid rgba(15,23,42,.12);
      background:rgba(255,255,255,.75);
    }

    /* ✅ 右上角按鈕群（抽歌 + 設定） */
    .headerBtns{
      display:inline-flex;
      align-items:center;
      gap:.45rem;
      flex: 0 0 auto;
    }

    .card{
      background:rgba(17,19,24,.85);
      border:1px solid rgba(35,39,51,.9);
      border-radius:var(--radius);
      box-shadow:0 10px 30px rgba(0,0,0,.35);
      overflow:hidden;
      position:relative;
    }
    html[data-theme="light"] .card{
      background:rgba(255,255,255,.85);
      border:1px solid rgba(15,23,42,.10);
      box-shadow:0 10px 30px rgba(15,23,42,.10);
    }

    label{font-size:.78rem; color:var(--muted)}
    select, input{
      background:rgba(0,0,0,.25);
      color:var(--text);
      border:1px solid rgba(255,255,255,.1);
      border-radius:12px;
      padding: var(--ctlPadY) var(--ctlPadX);
      font-size:.95rem;
      outline:none;
      height:var(--ctlH);
      line-height:1.2;
      min-width: 0;
    }
    html[data-theme="light"] select,
    html[data-theme="light"] input{
      background:rgba(255,255,255,.95);
      border:1px solid rgba(15,23,42,.14);
    }

    /* ✅ 修正：checkbox / radio 不要吃到一般 input 的 padding/height */
    input[type="checkbox"],
    input[type="radio"]{
      height:auto;
      padding:0;
      border:none;
      background:transparent;
      border-radius:0;
      min-width:auto;
    }

    input{min-width: 12rem;}
    input::placeholder{color:#7e8a96}
    html[data-theme="light"] input::placeholder{color:#64748b}

    .btn{
      background:var(--btn);
      border:1px solid rgba(255,255,255,.08);
      color:var(--text);
      padding: var(--ctlPadY) .85rem;
      border-radius:14px;
      cursor:pointer;
      font-size:.95rem;
      display:inline-flex; align-items:center; gap:.4rem;
      user-select:none;
      transition:.15s transform, .15s background;
      white-space:nowrap;
      height:var(--ctlH);
      line-height:1.2;
      font-weight:800;
      min-width: 0;
    }
    html[data-theme="light"] .btn{ border:1px solid rgba(15,23,42,.12); }
    .btn:hover{background:var(--btn2)}
    .btn:active{transform:translateY(1px)}
    .btn.primary{
      background:rgba(122,162,255,.18);
      border-color:rgba(122,162,255,.45);
    }
    html[data-theme="light"] .btn.primary{
      background:rgba(43,107,255,.14);
      border-color:rgba(43,107,255,.35);
    }

    .iconBtn{
      width:var(--ctlH); height:var(--ctlH);
      padding:0;
      justify-content:center;
      border-radius:14px;
      flex: 0 0 auto;
    }
    .iconBtn svg{width:1.15rem; height:1.15rem}

    /* ✅ 抽歌按鈕（icon） */
    .drawBtn{
      background:rgba(122,162,255,.14);
      border:1px solid rgba(122,162,255,.35);
    }
    html[data-theme="light"] .drawBtn{
      background:rgba(43,107,255,.12);
      border:1px solid rgba(43,107,255,.28);
    }

    .xBtn{
      width:var(--ctlH); height:var(--ctlH);
      padding:0;
      justify-content:center;
      border-radius:14px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      font-weight:900;
      font-size:1.05rem;
      line-height:var(--ctlH);
      flex: 0 0 auto;
    }
    html[data-theme="light"] .xBtn{
      background:rgba(15,23,42,.04);
      border:1px solid rgba(15,23,42,.12);
    }

    /* ✅ 設定按鈕 */
    .settingsBtn{
      width:var(--ctlH); height:var(--ctlH);
      padding:0;
      justify-content:center;
      border-radius:14px;
    }
    .settingsBtn svg{width:1.15rem; height:1.15rem}

    /* ✅ 搜尋列：取消置頂（不 sticky） + 與下拉篩選同一個 layout */
    .filtersTop{
      position: relative;
      z-index: 1;

      padding: .40rem .5rem .18rem .5rem;
      border-bottom: 1px solid var(--line);

      background: rgba(0,0,0,.10);
      backdrop-filter: blur(10px);
    }
    html[data-theme="light"] .filtersTop{
      background: rgba(255,255,255,.72);
    }

    .searchRow{
      display:flex;
      align-items:center;
      gap:.45rem;
      width:100%;
      flex-wrap: nowrap;
      min-width:0;
    }

    /* ✅ 搜尋至少一半寬度；其他三個平均吃剩下 */
    .searchRow input{
      flex: 3 1 0;
      min-width: 0;
    }
    .searchRow .btn{
      flex: 1 1 0;
      min-width: 0;
      justify-content:center;
      padding-left: 0;
      padding-right: 0;
    }
    .searchRow .iconBtn,
    .searchRow .xBtn{
      width:auto;
    }

    .filtersArea{
      padding: 0;
      border-bottom: 1px solid var(--line);
    }

    .collapseBtn{
      padding: 0;
      border-radius:12px;
      font-weight:900;
      letter-spacing:.5px;
    }
    .collapseBtn svg{ width:1.15rem; height:1.15rem; transition: .18s transform; }
    .collapseBtn[aria-expanded="false"] svg{ transform: rotate(-90deg); }
    .collapseBtn .t{ display:none; }

    .filtersBody{
      position: relative;
      z-index: 1;

      background: rgba(0,0,0,.08);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);

      overflow:hidden;
      max-height: 600px;
      transition: max-height .22s ease, padding .22s ease;

      padding: .18rem .5rem .42rem .5rem;
    }
    html[data-theme="light"] .filtersBody{
      background: rgba(255,255,255,.62);
    }

    .filtersBody.collapsed{
      max-height: 0px;
      padding-top: 0;
      padding-bottom: 0;
      border-bottom: 0;
    }

    .filtersRow{
      display:flex;
      gap:.45rem;
      flex-wrap:wrap;
      align-items:flex-end;
      justify-content:flex-start;
      min-width: 0;
    }

    .filterItem{
      display:inline-flex;
      align-items:flex-end;
      gap:.35rem;
      min-width: 0;
    }
    .filterItem label{white-space:nowrap; line-height:1.1}
    .filterItem select{min-width: 7rem}

    .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .table-min-width{ min-width: 520px; }

    .thead{
      display:grid;
      grid-template-columns: var(--grid);
      padding:.6rem .75rem;
      font-size:.78rem;
      color:var(--muted);
      border-bottom:1px solid var(--line);
      background:rgba(0,0,0,.14);
      user-select:none;
    }
    html[data-theme="light"] .thead{ background:rgba(15,23,42,.04); }

    .th{
      padding:0 .45rem;
      display:flex; align-items:center; gap:.35rem;
      min-width:0;
    }
    .th:first-child{padding-left:.3rem}
    .th.sortable{cursor:pointer}
    .sortMark{font-size:.75rem; opacity:.9}
    .sortMark.off{opacity:.35}

    /* ✅ 需求：編號/歌名/歌手 標題列與內容靠左對齊 */
    .thead .th:nth-child(2),
    .thead .th:nth-child(3),
    .thead .th:nth-child(4){
      justify-content:flex-start;
      text-align:left;
    }
    .row .cell:nth-child(2),
    .row .cell:nth-child(3),
    .row .cell:nth-child(4){
      text-align:left;
    }

    .viewport{
      height: 70vh;
      overflow:auto;
      position:relative;
    }
    .spacer{height:0px}
    .rows{
      position:absolute; left:0; top:0; right:0;
      padding:0 .75rem .5rem .75rem;
    }

    .row{
      display:grid;
      grid-template-columns: var(--grid);
      align-items:stretch;
      height:var(--rowH);
      border-bottom:1px solid rgba(35,39,51,.7);
      border-radius:10px;
      cursor:pointer;
    }
    html[data-theme="light"] .row{
      border-bottom:1px solid rgba(15,23,42,.10);
    }
    .row:hover{background:rgba(255,255,255,.04)}
    html[data-theme="light"] .row:hover{background:rgba(15,23,42,.04)}

    .cell{
      padding:.45rem .45rem;
      font-size:.9rem;
      min-width:0;
      overflow:hidden;
    }

    .cell.wrap2{
      white-space:normal;
      display:-webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow:hidden;
      line-height:1.25;
    }

    .cell.small{
      font-size:.78rem;
      color:#cdd6e1;
      white-space:nowrap;
      text-overflow:ellipsis;
    }
    html[data-theme="light"] .cell.small{color:#334155}

    .tag{
      display:inline-flex; align-items:center;
      border:1px solid rgba(255,255,255,.12);
      padding:.12rem .45rem; border-radius:999px;
      font-size:.78rem; color:#cdd6e1;
      background:rgba(255,255,255,.06);
      white-space:nowrap;
    }
    html[data-theme="light"] .tag{
      border:1px solid rgba(15,23,42,.12);
      color:#0f172a;
      background:rgba(15,23,42,.04);
    }

    .copyWrap{ display:flex; justify-content:center; align-items:center; }
    .copyBtn{
      width:2.15rem; height:1.85rem;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      color:var(--text);
      cursor:pointer;
      display:inline-flex; align-items:center; justify-content:center;
      transition:.15s transform, .15s background;
      user-select:none;
    }
    html[data-theme="light"] .copyBtn{
      border:1px solid rgba(15,23,42,.12);
      background:rgba(15,23,42,.03);
    }
    .copyBtn svg{width:1.05rem; height:1.05rem; opacity:.9}

    .toast{
      position:fixed; right:14px; bottom:14px;
      background:rgba(17,19,24,.92);
      border:1px solid rgba(255,255,255,.12);
      border-radius:14px;
      padding:.55rem .65rem;
      color:var(--text);
      box-shadow:0 12px 30px rgba(0,0,0,.4);
      display:none;
      max-width:min(520px, calc(100vw - 28px));
      font-size:.85rem;
      z-index:9999;
    }
    html[data-theme="light"] .toast{
      background:rgba(255,255,255,.92);
      border:1px solid rgba(15,23,42,.12);
      box-shadow:0 12px 30px rgba(15,23,42,.14);
    }
    .toast.show{display:block}
    .toast .t{color:var(--muted); font-size:.78rem; margin-top:.2rem}

    /* ✅ (4) 滑動至頂部 */
    .toTop{
      position: fixed;
      right: 14px;
      bottom: 78px;
      z-index: 9998;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: .18s opacity, .18s transform;
    }
    .toTop.show{
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .modalBack{
      position:fixed; inset:0;
      background:rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding:16px;
      z-index:10000;
    }
    html[data-theme="light"] .modalBack{ background:rgba(15,23,42,.35); }
    .modalBack.show{display:flex}

    /* ✅ 讓彈窗內容「自適應一頁」 */
    .modal{
      width:min(720px, 100%);
      background:rgba(17,19,24,.96);
      border:1px solid rgba(255,255,255,.14);
      border-radius:16px;
      box-shadow:0 18px 60px rgba(0,0,0,.55);
      overflow:hidden;

      max-height: calc(100vh - 32px);
      display:flex;
      flex-direction:column;
    }
    html[data-theme="light"] .modal{
      background:rgba(255,255,255,.96);
      border:1px solid rgba(15,23,42,.12);
      box-shadow:0 18px 60px rgba(15,23,42,.18);
    }
    .modalHead{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:.65rem .75rem;
      border-bottom:1px solid rgba(255,255,255,.10);
      flex: 0 0 auto;
    }
    html[data-theme="light"] .modalHead{ border-bottom:1px solid rgba(15,23,42,.10); }
    .modalTitle{ font-weight:900; font-size:.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .modalClose{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:var(--text);
      border-radius:12px;
      padding:.45rem .55rem;
      cursor:pointer;
      font-size:.85rem;
      height:var(--ctlH);
      display:inline-flex; align-items:center;
    }
    html[data-theme="light"] .modalClose{
      background:rgba(15,23,42,.04);
      border:1px solid rgba(15,23,42,.12);
    }

    /* ✅ 詳細資訊欄位 1:3 */
    .modalBody{
      padding:.65rem .75rem;
      display:grid;
      grid-template-columns: minmax(5.2rem, 1fr) 3fr;
      gap:.5rem .6rem;
      font-size:.9rem;

      flex: 1 1 auto;
      overflow:auto;
      min-height: 0;
    }
    .k{color:var(--muted); font-size:.85rem}
    .v{color:var(--text); word-break:break-word}

    .modalFoot{
      padding:.65rem .75rem;
      border-top:1px solid rgba(255,255,255,.10);
      display:flex; gap:.6rem; justify-content:flex-end; flex-wrap:wrap;
      flex: 0 0 auto;
    }
    html[data-theme="light"] .modalFoot{ border-top:1px solid rgba(15,23,42,.10); }

    /* ✅ 設定 Modal 的 body */
    .settingsBody{
      padding:.65rem .75rem .8rem .75rem;
      display:block;
      font-size:.9rem;

      flex: 1 1 auto;
      overflow:auto;
      min-height: 0;
    }

    .settingsGrid{
      display:flex;
      flex-direction:column;
      gap:.75rem;
    }

    .settingsSection{
      display:flex;
      gap:.75rem;
      flex-wrap:wrap;
      align-items:center;
      min-width: 0;
    }

    /* ✅ A) 顯示欄位 */
    .settingsSection.block{
      flex-direction:column;
      align-items:stretch;
      gap:.45rem;
    }
    .settingsTitleRow{
      display:flex;
      align-items:center;
      gap:.5rem;
      color:var(--muted);
      font-size:.85rem;
    }
    .settingsOptionsRow{
      display:flex;
      flex-wrap:wrap;
      gap:.55rem .75rem;
      align-items:center;
      width:100%;
      min-width:0;
    }

    /* ✅ B) tick */
    .tick{
      display:grid;
      grid-template-columns: 1.15rem 1fr;
      align-items:center;
      column-gap:.45rem;

      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
      padding:.35rem .6rem;
      border-radius:999px;

      font-size:.78rem;
      cursor:pointer;
      user-select:none;

      white-space:normal;
      min-width: 0;
      max-width: 100%;
    }
    html[data-theme="light"] .tick{
      border:1px solid rgba(15,23,42,.12);
      background:rgba(255,255,255,.65);
    }
    .tick input{
      width:1.15rem;
      height:1.15rem;
      margin:0;
      accent-color: var(--accent);
      justify-self:start;
      flex: 0 0 auto;
    }
    .tick span{
      color:#cdd6e1;
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    html[data-theme="light"] .tick span{color:#0f172a}

    .radioWrap{
      display:flex;
      align-items:center;
      gap:.55rem;
      flex-wrap:wrap;
      min-width:0;
    }
    .radioWrap .tick{
      border-radius:999px;
    }

    /* ✅ RWD */
    @media (max-width: 900px){
      .wrap{margin:12px auto; padding:0 12px;}
      header{align-items:flex-start;}
      input{min-width: 10rem}
      .modalBody{ grid-template-columns: minmax(4.6rem, 1fr) 3fr; }
      :root{ --colFixed: var(--colFixedSm); }
      .table-min-width{min-width: 460px}
    }

    /* ✅ 小版面：把「抽歌」「進階設定」縮小到原先的一半大小 */
    @media (max-width: 520px){
      h1{font-size:1.15rem}
      .sub{font-size:.78rem}

      :root{
        --ctlH: 2.35rem;
        --ctlPadY: .42rem;
        --ctlPadX: .55rem;
      }
      .btn{font-size:.88rem}
      .iconBtn svg{width:1.05rem; height:1.05rem}
      .xBtn{font-size:1.00rem}

      /* ✅ 兩個 icon 按鈕縮小 0.5 倍（不影響其他按鈕） */
      .headerBtns .iconBtn{
        width: calc(var(--ctlH) * 0.5);
        height: calc(var(--ctlH) * 0.5);
        border-radius: 10px;
      }
      .headerBtns .iconBtn svg{
        width: .78rem;
        height: .78rem;
      }

      .filtersRow{
        width:100%;
        flex-direction:column;
        align-items:stretch;
        gap:.45rem;
      }
      .filterItem{
        width:100%;
        display:flex;
        flex-direction:column;
        align-items:stretch;
        gap:.30rem;
      }
      .filterItem label{
        font-size:.78rem;
        color:var(--muted);
      }
      .filterItem select{
        width:100%;
        min-width: 0;
      }

      .thead{padding:.55rem .6rem;}
      .rows{padding:0 .6rem .5rem .6rem;}
      .table-min-width{min-width: 420px}

      .modalBody{ grid-template-columns: 1fr; }
      .k{margin-top:.35rem}
      .v{padding-bottom:.35rem; border-bottom:1px dashed rgba(255,255,255,.10)}
      html[data-theme="light"] .v{border-bottom:1px dashed rgba(15,23,42,.14)}
    }

    /* =========================
       ✅ 抽歌（玩法 Modal）
       ========================= */
    .drawBody{
      padding:.65rem .75rem;
      flex: 1 1 auto;
      overflow:auto;
      min-height:0;
      font-size:.9rem;
    }
    .drawIntro{
      color:var(--muted);
      font-size:.82rem;

  <!-- ✅ 互動標語 JSON（請放同層 slogans.json）
       格式：
       {
         "slogans": ["...","..."]
       }
  -->
  <script>
    window.SLOGANS_URL = "./slogans.json";
  </script>

  <script>
  ;(() => {
    "use strict";

    // ---------- Guard ----------
    if (!window.SONGS || !Array.isArray(window.SONGS)) {
      alert("songs.js 載入失敗，請確認檔案存在");
      throw new Error("SONGS not found");
    }

    // ---------- Config ----------
    const Config = Object.freeze({
      KEYS: Object.freeze({
        THEME: "songbook_theme",
        SHOWN: "songbook_shown_cols_v2",
        SLOGANS_CACHE: "songbook_slogans_cache_v1",
      }),
      LIMITS: Object.freeze({
        MAX_OPTIONS: 250,
        OVERSCAN: 10,
        TO_TOP_SHOW_AT: 220,
        TOAST_MS: 2000,
      }),
      COLS_BASE: Object.freeze([
        { key:"copy",   label:"",    sortable:false, widthVar:"--copyCol" },
        { key:"id",     label:"編號", sortable:true,  widthVar:"--colFixed", wrap2:true },
        { key:"title",  label:"歌名", sortable:true,  widthVar:"--colFixed", wrap2:true },
        { key:"artist", label:"歌手", sortable:true,  widthVar:"--colFixed", wrap2:true },
      ]),
      COLS_EXTRA: Object.freeze([
        { key:"lang", label:"語言",  sortable:true, widthVar:"--colLang" },
        { key:"len",  label:"字數",  sortable:true, widthVar:"--colLen" },
        { key:"who",  label:"誰的歌", sortable:true, widthVar:"--colWho" },
        { key:"page", label:"頁數",  sortable:true, widthVar:"--colPage" },
        { key:"book", label:"歌本",  sortable:true, widthVar:"--colWho" },
      ]),
    });

    // ---------- Utils ----------
    const Utils = Object.freeze({
      $: (id) => document.getElementById(id),
      normalize: (s) => (s ?? "").toString().toLowerCase().trim(),
      escapeHtml: (s) => (s ?? "").toString()
        .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
        .replaceAll('"',"&quot;").replaceAll("'","&#039;"),
      debounce: (fn, ms=120) => {
        let t=null;
        return (...args) => { clearTimeout(t); t=setTimeout(()=>fn(...args), ms); };
      },
      shuffleInPlace: (arr) => {
        for(let i=arr.length-1;i>0;i--){
          const j = Math.floor(Math.random()*(i+1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      },
      pickRandom: (arr) => {
        if(!arr || !arr.length) return null;
        return arr[Math.floor(Math.random()*arr.length)];
      },
    });

    // ---------- Event Bus ----------
    const Bus = (() => {
      const map = new Map();
      const on = (evt, fn) => {
        if(!map.has(evt)) map.set(evt, new Set());
        map.get(evt).add(fn);
        return () => map.get(evt)?.delete(fn);
      };
      const emit = (evt, payload) => map.get(evt)?.forEach(fn => fn(payload));
      return Object.freeze({ on, emit });
    })();

    // ---------- Storage ----------
    const Storage = (() => {
      const safeGet = (k, fallback=null) => { try { return localStorage.getItem(k) ?? fallback; } catch(_) { return fallback; } };
      const safeSet = (k, v) => { try { localStorage.setItem(k, v); } catch(_) {} };
      const safeGetJSON = (k, fallback=null) => {
        try { const raw = localStorage.getItem(k); return raw ? JSON.parse(raw) : fallback; }
        catch(_) { return fallback; }
      };
      const safeSetJSON = (k, obj) => { try { localStorage.setItem(k, JSON.stringify(obj)); } catch(_) {} };
      return Object.freeze({ safeGet, safeSet, safeGetJSON, safeSetJSON });
    })();

    // ---------- Theme ----------
    const Theme = (() => {
      const read = () => Storage.safeGet(Config.KEYS.THEME, "dark") || "dark";
      const apply = (theme) => {
        if(theme === "light") document.documentElement.setAttribute("data-theme","light");
        else document.documentElement.removeAttribute("data-theme");
        Storage.safeSet(Config.KEYS.THEME, theme);
      };
      return Object.freeze({ read, apply });
    })();

    // ---------- Metrics ----------
    const Metrics = (() => {
      const measureCssVarPx = (varName) => {
        const raw = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
        const probe = document.createElement("div");
        probe.style.position = "absolute";
        probe.style.left = "-99999px";
        probe.style.width = raw;
        document.body.appendChild(probe);
        const px = probe.getBoundingClientRect().width;
        document.body.removeChild(probe);
        return px;
      };
      const getRowHPx = () => {
        const v = getComputedStyle(document.documentElement).getPropertyValue("--rowH").trim();
        const probe = document.createElement("div");
        probe.style.position = "absolute";
        probe.style.left = "-99999px";
        probe.style.width = v;
        document.body.appendChild(probe);
        const px = probe.getBoundingClientRect().width;
        document.body.removeChild(probe);
        return Math.max(24, Math.round(px));
      };
      return Object.freeze({ measureCssVarPx, getRowHPx });
    })();

    // ---------- Clipboard ----------
    const Clipboard = (() => {
      const copy = async (text) => {
        try { await navigator.clipboard.writeText(text); }
        catch(_) {
          const ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
        }
      };
      return Object.freeze({ copy });
    })();

    // ---------- UI ----------
    const UI = (() => {
      const els = Object.freeze({
        countPill: Utils.$("countPill"),
        thead: Utils.$("thead"),
        viewport: Utils.$("viewport"),
        spacer: Utils.$("spacer"),
        rows: Utils.$("rows"),
        tableMinWidth: Utils.$("tableMinWidth"),

        q: Utils.$("q"),
        btnFilter: Utils.$("btnFilter"),
        btnClearFilters: Utils.$("btnClearFilters"),

        filterLang: Utils.$("filterLang"),
        filterLen: Utils.$("filterLen"),
        filterWho: Utils.$("filterWho"),

        btnToggleFilters: Utils.$("btnToggleFilters"),
        filtersBody: Utils.$("filtersBody"),

        btnToTop: Utils.$("btnToTop"),

        toast: Utils.$("toast"),
        toastMsg: Utils.$("toastMsg"),
        toastSub: Utils.$("toastSub"),

        modalBack: Utils.$("modalBack"),
        modalTitle: Utils.$("modalTitle"),
        modalBody: Utils.$("modalBody"),
        modalClose: Utils.$("modalClose"),
        modalClose2: Utils.$("modalClose2"),
        modalCopy: Utils.$("modalCopy"),

        // Settings
        btnSettings: Utils.$("btnSettings"),
        settingsBack: Utils.$("settingsBack"),
        settingsClose: Utils.$("settingsClose"),
        settingsDone: Utils.$("settingsDone"),

        toggleLight: Utils.$("toggleLight"),
        colLang: Utils.$("colLang"),
        colLen: Utils.$("colLen"),
        colWho: Utils.$("colWho"),
        colPage: Utils.$("colPage"),
        colBook: Utils.$("colBook"),

        // ✅ Draw (玩法)
        btnDraw: Utils.$("btnDraw"),
        drawBack: Utils.$("drawBack"),
        drawClose: Utils.$("drawClose"),
        drawClose2: Utils.$("drawClose2"),
        drawCount: Utils.$("drawCount"),
        btnDoDraw: Utils.$("btnDoDraw"),
        drawHint: Utils.$("drawHint"),

        // ✅ Draw (結果)
        drawResBack: Utils.$("drawResBack"),
        drawResTitle: Utils.$("drawResTitle"),
        drawResClose: Utils.$("drawResClose"),
        drawResClose2: Utils.$("drawResClose2"),
        drawResSlogan: Utils.$("drawResSlogan"),
        drawResList: Utils.$("drawResList"),
        btnCopyDraw: Utils.$("btnCopyDraw"),
        btnReroll: Utils.$("btnReroll"),
      });

      const toast = (msg, sub="") => {
        els.toastMsg.textContent = msg;
        els.toastSub.textContent = sub;
        els.toast.classList.add("show");
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(() => els.toast.classList.remove("show"), Config.LIMITS.TOAST_MS);
      };

      const readMatchMode = () =>
        document.querySelector('input[name="matchMode"]:checked')?.value || "fuzzy";

      return Object.freeze({ els, toast, readMatchMode });
    })();

    // ---------- Repo ----------
    const SongRepo = (() => {
      const normalizeRow = (r) => ({
        who: (r.who ?? "").toString().trim(),
        id: (r.id ?? "").toString().trim(),
        title: (r.title ?? "").toString().trim(),
        artist: (r.artist ?? "").toString().trim(),
        lang: (r.lang ?? "").toString().trim(),
        page: (r.page ?? "").toString().trim(),
        len: (r.len ?? "").toString().trim(),
        book: ((r.book ?? r.songbook ?? r.bookName ?? "")).toString().trim(),
      });

      const makeCopyLine = (row) =>
        [row.who,row.id,row.title,row.artist,row.lang,row.page,row.len,row.book]
          .filter(x => x !== "").join("\t");

      const build = (rawSongs) => {
        const base = rawSongs.map(normalizeRow);
        const copyLine = base.map(makeCopyLine);
        return Object.freeze({ base, copyLine });
      };

      const uniqueValues = (base, key) => {
        const set = new Set();
        for(const r of base){
          const v = (r[key] ?? "").toString().trim();
          if(v) set.add(v);
        }
        return Array.from(set);
      };

      return Object.freeze({ build, uniqueValues, makeCopyLine });
    })();

    // ---------- Query Engine ----------
    const QueryEngine = (() => {
      const passDropdown = (row, filters) => {
        if(filters.lang && row.lang !== filters.lang) return false;
        if(filters.len  && row.len  !== filters.len)  return false;
        if(filters.who  && row.who  !== filters.who)  return false;
        return true;
      };

      const combinedText = (row) =>
        Utils.normalize([row.who, row.id, row.title, row.artist, row.lang, row.page, row.len, row.book].join(" "));

      const passText = (row, qNorm, matchMode) => {
        if(!qNorm) return true;
        const t = combinedText(row);
        if(matchMode === "fuzzy"){
          const tokens = qNorm.split(/\s+/).filter(Boolean);
          for(const tok of tokens){
            if(!t.includes(tok)) return false;
          }
          return true;
        }
        return t.includes(qNorm);
      };

      const sortVal = (row, key) => {
        if(key === "len") return Number(row.len) || 0;
        if(key === "id") return Utils.normalize(row.id);
        if(key === "title") return Utils.normalize(row.title);
        if(key === "artist") return Utils.normalize(row.artist);
        if(key === "who") return Utils.normalize(row.who);
        if(key === "lang") return Utils.normalize(row.lang);
        if(key === "page") return Utils.normalize(row.page);
        if(key === "book") return Utils.normalize(row.book);
        return Utils.normalize(row.title);
      };

      const apply = (base, params) => {
        const { filters, q, matchMode, sortKey, sortDir } = params;
        const qNorm = Utils.normalize(q);
        const uids = [];

        for(let uid=0; uid<base.length; uid++){
          const r = base[uid];
          if(!passDropdown(r, filters)) continue;
          if(!passText(r, qNorm, matchMode)) continue;
          uids.push(uid);
        }

        if(sortKey && sortDir){
          const sign = (sortDir === "asc") ? 1 : -1;
          const k = sortKey;
          uids.sort((a,b) => {
            const ra = base[a], rb = base[b];
            const va = sortVal(ra, k);
            const vb = sortVal(rb, k);
            if(k === "len") return (va - vb) * sign || (a-b);
            if(va < vb) return -1 * sign;
            if(va > vb) return  1 * sign;
            return (a-b);
          });
        }

        return uids;
      };

      return Object.freeze({ apply });
    })();

    // ---------- Columns ----------
    const Columns = (() => {
      const loadShown = () => {
        const obj = Storage.safeGetJSON(Config.KEYS.SHOWN, null);
        const shown = { lang:false, len:false, who:false, page:false, book:false };
        if(obj && typeof obj === "object"){
          for(const k of Object.keys(shown)){
            if(typeof obj[k] === "boolean") shown[k] = obj[k];
          }
        }
        return shown;
      };

      const saveShown = (shown) => Storage.safeSetJSON(Config.KEYS.SHOWN, shown);

      const activeCols = (shown) => {
        const cols = [...Config.COLS_BASE];
        const extra = Config.COLS_EXTRA;
        if(shown.lang) cols.push(extra.find(c=>c.key==="lang"));
        if(shown.len)  cols.push(extra.find(c=>c.key==="len"));
        if(shown.who)  cols.push(extra.find(c=>c.key==="who"));
        if(shown.page) cols.push(extra.find(c=>c.key==="page"));
        if(shown.book) cols.push(extra.find(c=>c.key==="book"));
        return cols.filter(Boolean);
      };

      const setGridCssVar = (cols) => {
        const parts = cols.map(c => `var(${c.widthVar})`);
        document.documentElement.style.setProperty("--grid", parts.join(" "));
      };

      const setMinWidth = (cols) => {
        let minW = 0;
        for(const c of cols){
          minW += Metrics.measureCssVarPx(c.widthVar) + 16;
        }
        UI.els.tableMinWidth.style.minWidth = Math.max(420, Math.ceil(minW)) + "px";
      };

      const renderHeader = (cols, sortKey, sortDir) => {
        let html = "";
        for(const c of cols){
          if(c.key === "copy"){
            html += `<div class="th"></div>`;
            continue;
          }
          const isActive = (sortKey === c.key);
          const mark =
            !isActive ? `<span class="sortMark off">↕</span>` :
            (sortDir === "asc") ? `<span class="sortMark">↑</span>` :
            (sortDir === "desc") ? `<span class="sortMark">↓</span>` :
            `<span class="sortMark off">↕</span>`;

          html += `
            <div class="th sortable" data-sort-key="${c.key}">
              <span>${Utils.escapeHtml(c.label)}</span>
              ${mark}
            </div>
          `;
        }
        UI.els.thead.innerHTML = html;
      };

      const toggleSort = (current, key) => {
        const next = { sortKey: current.sortKey, sortDir: current.sortDir };
        if(next.sortKey !== key){
          next.sortKey = key;
          next.sortDir = "asc";
        }else{
          if(next.sortDir === "asc") next.sortDir = "desc";
          else if(next.sortDir === "desc"){ next.sortKey = ""; next.sortDir = ""; }
          else next.sortDir = "asc";
        }
        return next;
      };

      return Object.freeze({ loadShown, saveShown, activeCols, setGridCssVar, setMinWidth, renderHeader, toggleSort });
    })();

    // ---------- Virtual List ----------
    const VirtualList = (() => {
      const updateSpacer = (count, rowH) => {
        UI.els.spacer.style.height = (count * rowH + 8) + "px";
      };

      const render = (model) => {
        const { base, viewUIDs, rowH, cols } = model;

        const vp = UI.els.viewport;
        const rowsEl = UI.els.rows;

        const scrollTop = vp.scrollTop;
        const height = vp.clientHeight;

        const start = Math.max(0, Math.floor(scrollTop / rowH) - Config.LIMITS.OVERSCAN);
        const end = Math.min(viewUIDs.length, Math.ceil((scrollTop + height) / rowH) + Config.LIMITS.OVERSCAN);

        rowsEl.style.transform = `translateY(${start * rowH}px)`;

        let html = "";
        for(let i=start; i<end; i++){
          const uid = viewUIDs[i];
          const r = base[uid];

          const cells = [];
          for(const c of cols){
            if(c.key === "copy"){
              cells.push(`
                <div class="cell copyWrap">
                  <button class="copyBtn" title="複製這一筆" data-copy-uid="${uid}">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <path d="M9 9h10v12H9V9Z" stroke="currentColor" stroke-width="1.8" />
                      <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" stroke="currentColor" stroke-width="1.8" />
                    </svg>
                  </button>
                </div>
              `);
              continue;
            }

            const wrapClass = c.wrap2 ? "wrap2" : "";
            const eh = Utils.escapeHtml;
            if(c.key === "id"){
              cells.push(`<div class="cell ${wrapClass}" title="${eh(r.id)}">${eh(r.id)}</div>`);
            }else if(c.key === "title"){
              cells.push(`<div class="cell ${wrapClass}" title="${eh(r.title)}">${eh(r.title)}</div>`);
            }else if(c.key === "artist"){
              cells.push(`<div class="cell ${wrapClass}" title="${eh(r.artist)}">${eh(r.artist)}</div>`);
            }else if(c.key === "lang"){
              cells.push(`<div class="cell"><span class="tag">${eh(r.lang)}</span></div>`);
            }else if(c.key === "len"){
              cells.push(`<div class="cell small" title="${eh(r.len)}">${eh(r.len)}</div>`);
            }else if(c.key === "who"){
              cells.push(`<div class="cell small" title="${eh(r.who)}">${eh(r.who)}</div>`);
            }else if(c.key === "page"){
              cells.push(`<div class="cell small" title="${eh(r.page)}">${eh(r.page)}</div>`);
            }else if(c.key === "book"){
              cells.push(`<div class="cell small" title="${eh(r.book)}">${eh(r.book)}</div>`);
            }else{
              cells.push(`<div class="cell"></div>`);
            }
          }

          html += `<div class="row" data-row-uid="${uid}">${cells.join("")}</div>`;
        }

        rowsEl.innerHTML = html;
      };

      return Object.freeze({ updateSpacer, render });
    })();

    // ---------- Modals ----------
    const Modals = (() => {
      const openDetail = (row) => {
        UI.els.modalTitle.textContent = row?.title ? `詳細資料：${row.title}` : "詳細資料";

        const items = [
          ["編號", row.id],
          ["歌名", row.title],
          ["歌手", row.artist],
          ["語言", row.lang],
          ["字數", row.len],
          ["誰的歌", row.who],
          ["頁數", row.page],
          ["歌本", row.book],
        ];

        let html = "";
        for(const [k,v] of items){
          html += `<div class="k">${Utils.escapeHtml(k)}</div><div class="v">${Utils.escapeHtml(v || "")}</div>`;
        }
        UI.els.modalBody.innerHTML = html;

        UI.els.modalBack.classList.add("show");
        UI.els.modalBack.setAttribute("aria-hidden","false");
      };

      const closeDetail = () => {
        UI.els.modalBack.classList.remove("show");
        UI.els.modalBack.setAttribute("aria-hidden","true");
      };

      const openSettings = () => {
        UI.els.settingsBack.classList.add("show");
        UI.els.settingsBack.setAttribute("aria-hidden","false");
      };

      const closeSettings = () => {
        UI.els.settingsBack.classList.remove("show");
        UI.els.settingsBack.setAttribute("aria-hidden","true");
      };

      // ✅ Draw modal（玩法）
      const openDraw = () => {
        UI.els.drawBack.classList.add("show");
        UI.els.drawBack.setAttribute("aria-hidden","false");
      };
      const closeDraw = () => {
        UI.els.drawBack.classList.remove("show");
        UI.els.drawBack.setAttribute("aria-hidden","true");
      };

      // ✅ Draw Result modal（結果）
      const openDrawRes = () => {
        UI.els.drawResBack.classList.add("show");
        UI.els.drawResBack.setAttribute("aria-hidden","false");
      };
      const closeDrawRes = () => {
        UI.els.drawResBack.classList.remove("show");
        UI.els.drawResBack.setAttribute("aria-hidden","true");
      };

      return Object.freeze({
        openDetail, closeDetail,
        openSettings, closeSettings,
        openDraw, closeDraw,
        openDrawRes, closeDrawRes,
      });
    })();

    // ---------- Slogans ----------
    const Slogans = (() => {
      const normalize = (data) => {
        if(Array.isArray(data)) return data.map(x=>String(x)).filter(Boolean);
        if(data && typeof data === "object" && Array.isArray(data.slogans)) return data.slogans.map(x=>String(x)).filter(Boolean);
        return [];
      };

      const loadFromCache = () => {
        const cached = Storage.safeGetJSON(Config.KEYS.SLOGANS_CACHE, null);
        if(Array.isArray(cached) && cached.length) return cached;
        return null;
      };

      const saveToCache = (arr) => {
        if(Array.isArray(arr) && arr.length) Storage.safeSetJSON(Config.KEYS.SLOGANS_CACHE, arr);
      };

      const fetchJson = async (url) => {
        const res = await fetch(url, { cache: "no-store" });
        if(!res.ok) throw new Error(`fetch slogans failed: ${res.status}`);
        return await res.json();
      };

      const ensureLoaded = async () => {
        if(Slogans._list && Slogans._list.length) return Slogans._list;

        const cached = loadFromCache();
        if(cached){
          Slogans._list = cached;
          return cached;
        }

        const url = (window.SLOGANS_URL || "./slogans.json");
        const json = await fetchJson(url);
        const arr = normalize(json);
        if(arr.length){
          Slogans._list = arr;
          saveToCache(arr);
          return arr;
        }
        Slogans._list = [];
        return [];
      };

      const randomOne = async () => {
        const list = await ensureLoaded();
        return Utils.pickRandom(list) || "今天就交給命運安排一首！";
      };

      return Object.freeze({ ensureLoaded, randomOne, _list: null });
    })();

    // ---------- Draw Engine ----------
    const Draw = (() => {
      const formatLine = (row, idx) => {
        const no = String(idx+1).padStart(2,"0");
        const who = row.who ? `【${row.who}】` : "";
        const lang = row.lang ? `/${row.lang}` : "";
        const len = row.len ? `/${row.len}字` : "";
        const page = row.page ? ` p${row.page}` : "";
        const book = row.book ? `｜${row.book}` : "";
        return `${no}. ${who}${row.id ? " " + row.id : ""}｜${row.title || ""} - ${row.artist || ""}${lang}${len}${page}${book}`.trim();
      };

      const sampleUIDs = (uids, n) => {
        const copy = uids.slice();
        Utils.shuffleInPlace(copy);
        return copy.slice(0, n);
      };

      const renderInto = async (pickedUIDs, sloganEl, listEl, base) => {
        const slogan = await Slogans.randomOne();
        sloganEl.textContent = slogan;

        let html = "";
        pickedUIDs.forEach((uid, i) => {
          const r = base[uid];
          const title = Utils.escapeHtml(`${r.title || ""}`);
          const sub = Utils.escapeHtml(`${r.artist || ""}｜${r.id || ""}${r.lang ? "｜"+r.lang : ""}${r.len ? "｜"+r.len+"字" : ""}${r.page ? "｜p"+r.page : ""}${r.book ? "｜"+r.book : ""}`);
          html += `
            <div class="drawItem">
              <div class="drawMain">
                <div class="drawLine1">${String(i+1).padStart(2,"0")}. ${title}</div>
                <div class="drawLine2">${sub}</div>
              </div>
              <div class="drawActions">
                <button class="btn miniBtn" data-draw-copy-one="${uid}" title="複製這一首">📋</button>
              </div>
            </div>
          `;
        });

        listEl.innerHTML = html;
      };

      const copyDrawList = async (pickedUIDs, base) => {
        if(!pickedUIDs || !pickedUIDs.length){
          UI.toast("還沒抽歌", "先按「開始抽」");
          return;
        }
        const lines = pickedUIDs.map((uid,i)=>formatLine(base[uid], i));
        await Clipboard.copy(lines.join("\n"));
        UI.toast("已複製抽歌結果", `${pickedUIDs.length} 首`);
      };

      return Object.freeze({ sampleUIDs, renderInto, copyDrawList });
    })();

    // ---------- App ----------
    const App = (() => {
      const state = {
        repo: null,
        viewUIDs: [],
        filters: { lang:"", len:"", who:"" },
        sortKey: "",
        sortDir: "",
        shown: Columns.loadShown(),
        filtersCollapsed: false,
        rowH: 72,
        modalUID: null,

        // ✅ Draw state
        drawPickedUIDs: [],
        isDrawing: false,
      };

      const computeCols = () => Columns.activeCols(state.shown);

      const rebuildColumns = () => {
        const cols = computeCols();
        Columns.setGridCssVar(cols);
        Columns.setMinWidth(cols);
        Columns.renderHeader(cols, state.sortKey, state.sortDir);
        Bus.emit("cols:changed", cols);
      };

      const applyQuery = (opts={ keepScroll:false }) => {
        const keepScroll = !!opts.keepScroll;
        const prevTop = UI.els.viewport.scrollTop;

        const viewUIDs = QueryEngine.apply(state.repo.base, {
          filters: state.filters,
          q: UI.els.q.value,
          matchMode: document.querySelector('input[name="matchMode"]:checked')?.value || "fuzzy",
          sortKey: state.sortKey,
          sortDir: state.sortDir,
        });

        state.viewUIDs = viewUIDs;

        UI.els.countPill.textContent =
          `共 ${state.repo.base.length.toLocaleString()} 筆｜顯示 ${state.viewUIDs.length.toLocaleString()} 筆`;

        VirtualList.updateSpacer(state.viewUIDs.length, state.rowH);
        VirtualList.render({
          base: state.repo.base,
          viewUIDs: state.viewUIDs,
          rowH: state.rowH,
          cols: computeCols(),
        });

        if(keepScroll){
          UI.els.viewport.scrollTop = Math.min(
            prevTop,
            Math.max(0, state.viewUIDs.length * state.rowH - UI.els.viewport.clientHeight)
          );
        }else{
          UI.els.viewport.scrollTop = 0;
        }

        UI.els.drawHint.textContent = `提示：目前顯示 ${state.viewUIDs.length.toLocaleString()} 筆，抽歌會以此為母體。`;
        Bus.emit("list:updated", { count: state.viewUIDs.length });
      };

      const setFiltersCollapsed = (collapsed) => {
        state.filtersCollapsed = !!collapsed;
        UI.els.btnToggleFilters.setAttribute("aria-expanded", (!state.filtersCollapsed).toString());
        UI.els.filtersBody.classList.toggle("collapsed", state.filtersCollapsed);

        clearTimeout(window.__dockTimer);
        window.__dockTimer = setTimeout(() => {
          VirtualList.render({
            base: state.repo.base,
            viewUIDs: state.viewUIDs,
            rowH: state.rowH,
            cols: computeCols(),
          });
          Bus.emit("scroll:changed");
        }, 260);
      };

      const init = () => {
        Theme.apply(Theme.read());
        state.rowH = Metrics.getRowHPx();

        state.repo = SongRepo.build(window.SONGS);

        // build filter options
        const base = state.repo.base;
        const langs = SongRepo.uniqueValues(base, "lang").sort((a,b)=>a.localeCompare(b, "zh-Hant"));
        const whos  = SongRepo.uniqueValues(base, "who").sort((a,b)=>a.localeCompare(b, "zh-Hant"));
        const lens  = SongRepo.uniqueValues(base, "len").sort((a,b)=> (Number(a)||0) - (Number(b)||0));

        const setSelectOptions = (selectEl, values, placeholder="全部") => {
          selectEl.innerHTML = "";
          selectEl.appendChild(new Option(placeholder, ""));
          if(values.length > Config.LIMITS.MAX_OPTIONS){
            const opt = new Option(`（選項太多：${values.length}）`, "");
            opt.disabled = true;
            selectEl.appendChild(opt);
            return;
          }
          for(const v of values) selectEl.appendChild(new Option(v, v));
        };
        setSelectOptions(UI.els.filterLang, langs, "全部");
        setSelectOptions(UI.els.filterLen,  lens,  "全部");
        setSelectOptions(UI.els.filterWho,  whos,  "全部");

        // sync settings
        UI.els.toggleLight.checked = (Theme.read() === "light");
        UI.els.colLang.checked = state.shown.lang;
        UI.els.colLen.checked  = state.shown.len;
        UI.els.colWho.checked  = state.shown.who;
        UI.els.colPage.checked = state.shown.page;
        UI.els.colBook.checked = state.shown.book;

        rebuildColumns();
        setFiltersCollapsed(false);
        applyQuery({ keepScroll:true });

        Slogans.ensureLoaded().catch(()=>{});
      };

      return Object.freeze({ state, init, applyQuery, rebuildColumns, setFiltersCollapsed });
    })();

    // ---------- Events ----------
    const Events = (() => {
      const bind = () => {
        // Settings
        UI.els.btnSettings.addEventListener("click", Modals.openSettings);
        UI.els.settingsClose.addEventListener("click", Modals.closeSettings);
        UI.els.settingsDone.addEventListener("click", Modals.closeSettings);
        UI.els.settingsBack.addEventListener("click", (e) => {
          if(e.target === UI.els.settingsBack) Modals.closeSettings();
        });

        UI.els.toggleLight.addEventListener("change", () => {
          Theme.apply(UI.els.toggleLight.checked ? "light" : "dark");
          App.state.rowH = Metrics.getRowHPx();
          App.rebuildColumns();
          App.applyQuery({ keepScroll:true });
          UI.toast(UI.els.toggleLight.checked ? "已切換淺色模式" : "已切換深色模式");
        });

        const onShown = (key, checked) => {
          App.state.shown[key] = !!checked;
          Storage.safeSetJSON(Config.KEYS.SHOWN, App.state.shown);
          App.rebuildColumns();
          App.applyQuery({ keepScroll:true });
        };
        UI.els.colLang.addEventListener("change", () => onShown("lang", UI.els.colLang.checked));
        UI.els.colLen.addEventListener("change",  () => onShown("len",  UI.els.colLen.checked));
        UI.els.colWho.addEventListener("change",  () => onShown("who",  UI.els.colWho.checked));
        UI.els.colPage.addEventListener("change", () => onShown("page", UI.els.colPage.checked));
        UI.els.colBook.addEventListener("change", () => onShown("book", UI.els.colBook.checked));

        // Collapse filters
        UI.els.btnToggleFilters.addEventListener("click", () => {
          App.setFiltersCollapsed(!App.state.filtersCollapsed);
          UI.toast(App.state.filtersCollapsed ? "已收合篩選" : "已展開篩選");
        });

        // Search
        UI.els.q.addEventListener("keydown", (e) => {
          if(e.key === "Enter"){
            App.applyQuery({ keepScroll:false });
            UI.toast("已套用文字查詢", `顯示 ${App.state.viewUIDs.length.toLocaleString()} 筆`);
          }else if(e.key === "Escape"){
            UI.els.q.value = "";
            UI.toast("已清空文字輸入", "（不自動篩選）");
          }
        });
        UI.els.btnFilter.addEventListener("click", () => {
          App.applyQuery({ keepScroll:false });
          UI.toast("已套用篩選", `顯示 ${App.state.viewUIDs.length.toLocaleString()} 筆`);
        });

        UI.els.btnClearFilters.addEventListener("click", () => {
          UI.els.q.value = "";
          App.state.filters.lang = App.state.filters.len = App.state.filters.who = "";
          UI.els.filterLang.value = "";
          UI.els.filterLen.value = "";
          UI.els.filterWho.value = "";
          App.state.sortKey = ""; App.state.sortDir = "";
          App.rebuildColumns();
          App.applyQuery({ keepScroll:false });
          UI.toast("已清空", "文字/下拉/排序 已重置");
        });

        UI.els.filterLang.addEventListener("change", () => { App.state.filters.lang = UI.els.filterLang.value; App.applyQuery({ keepScroll:false }); });
        UI.els.filterLen.addEventListener("change",  () => { App.state.filters.len  = UI.els.filterLen.value;  App.applyQuery({ keepScroll:false }); });
        UI.els.filterWho.addEventListener("change",  () => { App.state.filters.who  = UI.els.filterWho.value;  App.applyQuery({ keepScroll:false }); });

        // Sort header
        UI.els.thead.addEventListener("click", (e) => {
          const el = e.target.closest("[data-sort-key]");
          if(!el) return;
          const key = el.getAttribute("data-sort-key");
          const next = Columns.toggleSort({ sortKey: App.state.sortKey, sortDir: App.state.sortDir }, key);
          App.state.sortKey = next.sortKey;
          App.state.sortDir = next.sortDir;
          App.rebuildColumns();
          App.applyQuery({ keepScroll:false });
        });

        // Virtual list scroll
        UI.els.viewport.addEventListener("scroll", () => {
          VirtualList.render({
            base: App.state.repo.base,
            viewUIDs: App.state.viewUIDs,
            rowH: App.state.rowH,
            cols: Columns.activeCols(App.state.shown),
          });
        });

        // Rows click
        UI.els.rows.addEventListener("click", async (e) => {
          const copyBtn = e.target.closest("[data-copy-uid]");
          if(copyBtn){
            e.stopPropagation();
            const uid = Number(copyBtn.getAttribute("data-copy-uid"));
            await Clipboard.copy(App.state.repo.copyLine[uid] ?? "");
            UI.toast("已複製", App.state.repo.base[uid]?.title ? `「${App.state.repo.base[uid].title}」` : "");
            return;
          }
          const row = e.target.closest("[data-row-uid]");
          if(row){
            const uid = Number(row.getAttribute("data-row-uid"));
            App.state.modalUID = uid;
            Modals.openDetail(App.state.repo.base[uid]);
          }
        });

        // Detail modal close
        UI.els.modalClose.addEventListener("click", () => { Modals.closeDetail(); App.state.modalUID=null; });
        UI.els.modalClose2.addEventListener("click", () => { Modals.closeDetail(); App.state.modalUID=null; });
        UI.els.modalBack.addEventListener("click", (e) => {
          if(e.target === UI.els.modalBack) { Modals.closeDetail(); App.state.modalUID=null; }
        });

        UI.els.modalCopy.addEventListener("click", async () => {
          const uid = App.state.modalUID;
          if(uid == null) return;
          await Clipboard.copy(App.state.repo.copyLine[uid] ?? "");
          UI.toast("已複製", App.state.repo.base[uid]?.title ? `「${App.state.repo.base[uid].title}」` : "");
        });

        // ==========================
        // ✅ 抽歌：修正「按開始抽沒跳結果」
        // - 保證：先渲染 drawResBack，再 show
        // - 避免：連點造成狀態混亂（isDrawing guard）
        // ==========================
        UI.els.btnDraw.addEventListener("click", () => {
          UI.els.drawHint.textContent = `提示：目前顯示 ${App.state.viewUIDs.length.toLocaleString()} 筆，抽歌會以此為母體。`;
          Slogans.ensureLoaded().catch(()=>{});
          Modals.openDraw();
        });

        const closeDrawAll = () => Modals.closeDraw();
        UI.els.drawClose.addEventListener("click", closeDrawAll);
        UI.els.drawClose2.addEventListener("click", closeDrawAll);
        UI.els.drawBack.addEventListener("click", (e) => { if(e.target === UI.els.drawBack) closeDrawAll(); });

        const closeDrawResAll = () => Modals.closeDrawRes();
        UI.els.drawResClose.addEventListener("click", closeDrawResAll);
        UI.els.drawResClose2.addEventListener("click", closeDrawResAll);
        UI.els.drawResBack.addEventListener("click", (e) => { if(e.target === UI.els.drawResBack) closeDrawResAll(); });

        const doDrawOnce = async (alsoKeepResOpen=false) => {
          if(App.state.isDrawing) return; // 防連點
          App.state.isDrawing = true;
          UI.els.btnDoDraw.disabled = true;
          UI.els.btnReroll.disabled = true;

          try{
            const n = Number(UI.els.drawCount.value) || 1;
            const pool = App.state.viewUIDs;

            if(!pool.length){
              UI.toast("沒有可抽的歌", "目前篩選結果是 0 筆");
              App.state.drawPickedUIDs = [];
              return;
            }

            const k = Math.min(n, pool.length);
            const picked = Draw.sampleUIDs(pool, k);
            App.state.drawPickedUIDs = picked;

            // ✅ 先渲染結果
            UI.els.drawResTitle.textContent = `抽到啦 🎉（${k} 首）`;
            await Draw.renderInto(picked, UI.els.drawResSlogan, UI.els.drawResList, App.state.repo.base);

            // ✅ 再顯示結果視窗（修正：一定會跳出）
            if(!alsoKeepResOpen){
              Modals.closeDraw();
              Modals.openDrawRes();
            }else{
              // reroll：結果窗已開，確保仍是 show
              Modals.openDrawRes();
            }

            UI.toast("抽到了！", `${k} / ${pool.length.toLocaleString()}（從目前篩選結果抽）`);
          }finally{
            UI.els.btnDoDraw.disabled = false;
            UI.els.btnReroll.disabled = false;
            App.state.isDrawing = false;
          }
        };

        UI.els.btnDoDraw.addEventListener("click", () => doDrawOnce(false));

        UI.els.btnReroll.addEventListener("click", () => doDrawOnce(true));

        UI.els.btnCopyDraw.addEventListener("click", async () => {
          await Draw.copyDrawList(App.state.drawPickedUIDs, App.state.repo.base);
        });

        UI.els.drawResList.addEventListener("click", async (e) => {
          const btn = e.target.closest("[data-draw-copy-one]");
          if(!btn) return;
          const uid = Number(btn.getAttribute("data-draw-copy-one"));
          const line = SongRepo.makeCopyLine(App.state.repo.base[uid] || {});
          await Clipboard.copy(line);
          UI.toast("已複製這一首", App.state.repo.base[uid]?.title ? `「${App.state.repo.base[uid].title}」` : "");
        });

        // Esc
        document.addEventListener("keydown", (e) => {
          if(e.key !== "Escape") return;
          if(UI.els.modalBack.classList.contains("show")) { Modals.closeDetail(); App.state.modalUID=null; }
          if(UI.els.settingsBack.classList.contains("show")) Modals.closeSettings();
          if(UI.els.drawBack.classList.contains("show")) Modals.closeDraw();
          if(UI.els.drawResBack.classList.contains("show")) Modals.closeDrawRes();
        });

        // To top
        UI.els.btnToTop.addEventListener("click", () => {
          UI.els.viewport?.scrollTo({ top: 0, behavior: "smooth" });
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      };

      return Object.freeze({ bind });
    })();

    // ---------- Boot ----------
    App.init();
    Events.bind();
  })();
  </script>
</body>
</html>
