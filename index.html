<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>二結點歌本速查</title>
  <style>
    :root{
      --bg:#0b0c10; --card:#111318; --text:#e9eef6; --muted:#9aa6b2;
      --line:#232733; --btn:#1c2230; --btn2:#22314a; --accent:#7aa2ff;
      --radius:14px;

      /* 虛擬清單：固定列高（跳行最多 2 行，因此列高加大） */
      --rowH:72px;

      /* 欄寬 */
      --copyCol: 56px;

      /* ✅ 編號 / 歌名 / 歌手 等分 */
      --colA: 1fr;
      --colB: 1fr;
      --colC: 1fr;

      /* 其他欄位（顯示切換後才會出現，排列在後面） */
      --colWho: 120px;
      --colLang: 90px;
      --colPage: 110px;
      --colLen: 70px;

      /* Grid（JS 會動態改） */
      --grid: var(--copyCol) var(--colA) var(--colB) var(--colC);
      font-synthesis-weight:none;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:linear-gradient(180deg,#07080b, #0b0c10 40%, #07080b);
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      touch-action: pan-x pan-y;
    }

    .wrap{max-width:1100px; margin:16px auto; padding:0 14px;}
    header{
      display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
      margin-bottom:10px;
    }
    h1{margin:0; font-size:22px; letter-spacing:.5px}
    .sub{color:var(--muted); font-size:13px; margin-top:6px}
    .pill{
      font-size:12px; color:var(--muted);
      padding:6px 10px; border:1px solid rgba(255,255,255,.08);
      border-radius:999px;
      background:rgba(0,0,0,.18);
      white-space:nowrap;
    }

    .card{
      background:rgba(17,19,24,.85);
      border:1px solid rgba(35,39,51,.9);
      border-radius:var(--radius);
      box-shadow:0 10px 30px rgba(0,0,0,.35);
      overflow:hidden;
    }

    .toolbar{
      display:flex;
      gap:10px;
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      align-items:center;
      flex-wrap:wrap;
    }

    label{font-size:12px; color:var(--muted)}
    select, input{
      background:rgba(0,0,0,.25);
      color:var(--text);
      border:1px solid rgba(255,255,255,.1);
      border-radius:12px;
      padding:10px 12px;
      font-size:15px; /* ✅ 放大字體 */
      outline:none;
      height:44px;   /* ✅ 跟「篩選」同高 */
      line-height:22px;
    }
    input::placeholder{color:#7e8a96}

    .btn{
      background:var(--btn);
      border:1px solid rgba(255,255,255,.08);
      color:var(--text);
      padding:10px 14px;
      border-radius:14px;
      cursor:pointer;
      font-size:15px;
      display:inline-flex; align-items:center; gap:8px;
      user-select:none;
      transition:.15s transform, .15s background;
      white-space:nowrap;
      height:44px;
      line-height:22px;
      font-weight:700;
    }
    .btn:hover{background:var(--btn2)}
    .btn:active{transform:translateY(1px)}
    .btn.primary{
      background:rgba(122,162,255,.18);
      border-color:rgba(122,162,255,.45);
    }
    .btn.primary:hover{background:rgba(122,162,255,.24)}

    .left{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      flex: 1 1 auto;
    }
    .right{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      margin-left:auto;
    }

    /* ✅ 顯示欄位：縮成同一橫排，去除不必要空間 */
    .colsRow{
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-bottom:1px solid var(--line);
      background:rgba(0,0,0,.08);
      flex-wrap:wrap;
    }
    .colsRow .title{
      font-size:12px;
      color:var(--muted);
      margin-right:6px;
      white-space:nowrap;
    }
    .chip{
      display:inline-flex; align-items:center; gap:6px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
      padding:5px 8px;
      border-radius:999px;
      font-size:12px;
      cursor:pointer;
      user-select:none;
      white-space:nowrap;
    }
    .chip input{width:16px; height:16px; margin:0; accent-color: var(--accent);}
    .chip span{color:#cdd6e1}

    /* 表格：水平可滑 */
    .table-scroll{
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
    }
    .table-min-width{
      min-width: 760px;
    }

    /* 表頭（可點排序） */
    .thead{
      display:grid;
      grid-template-columns: var(--grid);
      padding:10px 12px;
      font-size:12px;
      color:var(--muted);
      border-bottom:1px solid var(--line);
      background:rgba(0,0,0,.14);
      user-select:none;
    }
    .th{
      padding:0 8px;
      display:flex; align-items:center; gap:6px;
      min-width:0;
    }
    .th:first-child{padding-left:6px}
    .th.sortable{cursor:pointer}
    .th.sortable:hover{color:#c8d2dd}
    .sortMark{font-size:11px; opacity:.9}
    .sortMark.off{opacity:.35}

    /* 虛擬清單 */
    .viewport{
      height: 70vh;
      overflow:auto;
      position:relative;
    }
    .spacer{height:0px}
    .rows{
      position:absolute; left:0; top:0; right:0;
      padding:0 12px 8px 12px;
    }

    .row{
      display:grid;
      grid-template-columns: var(--grid);
      align-items:stretch;
      height:var(--rowH);
      border-bottom:1px solid rgba(35,39,51,.7);
      border-radius:10px;
      cursor:pointer;
    }
    .row:hover{background:rgba(255,255,255,.04)}

    .cell{
      padding:8px 8px;
      font-size:14px;
      min-width:0;
      overflow:hidden;
    }

    /* ✅ 主要三欄允許跳行（最多 2 行），超過省略 */
    .cell.wrap2{
      white-space:normal;
      display:-webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow:hidden;
      line-height:1.25;
    }
    .cell.small{font-size:12px; color:#cdd6e1; white-space:nowrap; text-overflow:ellipsis}

    .tag{
      display:inline-flex; align-items:center;
      border:1px solid rgba(255,255,255,.12);
      padding:2px 8px; border-radius:999px;
      font-size:12px; color:#cdd6e1;
      background:rgba(255,255,255,.06);
      white-space:nowrap;
    }

    .copyWrap{
      display:flex; justify-content:center; align-items:center;
    }
    .copyBtn{
      width:38px; height:32px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      color:var(--text);
      cursor:pointer;
      display:inline-flex; align-items:center; justify-content:center;
      transition:.15s transform, .15s background;
      user-select:none;
    }
    .copyBtn:hover{background:rgba(255,255,255,.10)}
    .copyBtn:active{transform:translateY(1px)}
    .copyBtn svg{width:18px; height:18px; opacity:.9}

    /* Toast */
    .toast{
      position:fixed; right:14px; bottom:14px;
      background:rgba(17,19,24,.92);
      border:1px solid rgba(255,255,255,.12);
      border-radius:14px;
      padding:10px 12px;
      color:var(--text);
      box-shadow:0 12px 30px rgba(0,0,0,.4);
      display:none;
      max-width:min(520px, calc(100vw - 28px));
      font-size:13px;
      z-index:9999;
    }
    .toast.show{display:block}
    .toast .t{color:var(--muted); font-size:12px; margin-top:4px}

    /* Modal */
    .modalBack{
      position:fixed; inset:0;
      background:rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding:16px;
      z-index:10000;
    }
    .modalBack.show{display:flex}
    .modal{
      width:min(720px, 100%);
      background:rgba(17,19,24,.96);
      border:1px solid rgba(255,255,255,.14);
      border-radius:16px;
      box-shadow:0 18px 60px rgba(0,0,0,.55);
      overflow:hidden;
    }
    .modalHead{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:12px 14px;
      border-bottom:1px solid rgba(255,255,255,.10);
    }
    .modalTitle{
      font-weight:800;
      font-size:15px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .modalClose{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:var(--text);
      border-radius:12px;
      padding:8px 10px;
      cursor:pointer;
      font-size:13px;
    }
    .modalBody{
      padding:12px 14px;
      display:grid;
      grid-template-columns: 120px 1fr;
      gap:10px 12px;
      font-size:14px;
    }
    .k{color:var(--muted); font-size:13px}
    .v{color:var(--text); word-break:break-word}
    .modalFoot{
      padding:12px 14px;
      border-top:1px solid rgba(255,255,255,.10);
      display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;
    }

    /* 手機 */
    @media (max-width: 820px){
      .wrap{margin:12px auto}
      h1{font-size:20px}
      .toolbar{gap:8px}
      select, input, .btn{font-size:15px}
      .modalBody{grid-template-columns: 92px 1fr}
    }
  </style>
</head>

<body>
<div class="wrap">
  <header>
    <div>
      <h1>二結點歌本速查</h1>
      <div class="sub">下拉選單可多重篩選；點「篩選」可用文字查；點表頭可排序；點任一列可看詳細。</div>
    </div>
    <div class="pill" id="countPill">載入中…</div>
  </header>

  <div class="card">
    <div class="toolbar">
      <div class="left">
        <input id="q" placeholder="文字查詢（Enter 或 點 篩選）" />
        <button class="btn primary" id="btnFilter">🔍 篩選</button>

        <!-- ✅ 模糊/精準：改成勾選兩個選項（互斥） -->
        <label style="display:flex; align-items:center; gap:8px;">
          <input type="radio" name="matchMode" id="modeFuzzy" value="fuzzy" checked style="width:18px;height:18px;accent-color:var(--accent)">
          <span style="font-size:13px;color:var(--muted)">模糊比對</span>
        </label>
        <label style="display:flex; align-items:center; gap:8px;">
          <input type="radio" name="matchMode" id="modeExact" value="exact" style="width:18px;height:18px;accent-color:var(--accent)">
          <span style="font-size:13px;color:var(--muted)">精準比對</span>
        </label>
      </div>

      <!-- ✅ 下拉式順序：語言、字數、誰的歌（同一排） -->
      <div class="right">
        <label>語言</label>
        <select id="filterLang"></select>

        <label>字數</label>
        <select id="filterLen"></select>

        <label>誰的歌</label>
        <select id="filterWho"></select>
      </div>
    </div>

    <!-- ✅ 顯示欄位：同一橫排、緊湊 -->
    <div class="colsRow">
      <div class="title">顯示欄位：</div>
      <label class="chip"><input type="checkbox" id="colWho" /><span>誰的歌</span></label>
      <label class="chip"><input type="checkbox" id="colLang" /><span>語言</span></label>
      <label class="chip"><input type="checkbox" id="colPage" /><span>頁數</span></label>
      <label class="chip"><input type="checkbox" id="colLen" /><span>字數</span></label>
    </div>

    <div class="table-scroll" id="tableScroll">
      <div class="table-min-width" id="tableMinWidth">
        <div class="thead" id="thead"></div>

        <div class="viewport" id="viewport">
          <div class="spacer" id="spacer"></div>
          <div class="rows" id="rows"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <div id="toastMsg">OK</div>
  <div class="t" id="toastSub"></div>
</div>

<!-- 詳細資料視窗 -->
<div class="modalBack" id="modalBack" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal">
    <div class="modalHead">
      <div class="modalTitle" id="modalTitle">詳細資料</div>
      <button class="modalClose" id="modalClose">關閉</button>
    </div>
    <div class="modalBody" id="modalBody"></div>
    <div class="modalFoot">
      <button class="btn" id="modalCopy">📋 複製這一筆</button>
      <button class="btn" id="modalClose2">關閉</button>
    </div>
  </div>
</div>

<script>
/**
 * ✅ 資料格式（新增 len 變數）
 * { who:"", id:"920833", title:"真情磅無中", artist:"鐵澄", lang:"台語", page:"第071頁", len:"1" }
 *
 * - len: 字數（字串或數字都可，但建議字串）
 */
const SONGS = [
  { who:"媽媽", id:"918076", title:"真情放袂離", artist:"佚名", lang:"台語", page:"第071頁", len:"4" },
  { who:"合唱", id:"917544", title:"真情放袂開", artist:"羅文聰、陳亞蘭", lang:"台語", page:"第071頁", len:"4" },
  { who:"爸爸", id:"911356", title:"真情無後悔", artist:"龍千玉", lang:"台語", page:"第071頁", len:"5" },
  { who:"",     id:"920833", title:"真情磅無中", artist:"鐵澄", lang:"台語", page:"第071頁", len:"1" },
  { who:"媽媽", id:"919060", title:"真愛一萬年", artist:"良一、綾", lang:"台語", page:"第071頁", len:"5" },
  { who:"",     id:"925178", title:"真愛歹收回", artist:"林孟宗", lang:"台語", page:"第071頁", len:"5" },
  { who:"哥哥", id:"912880", title:"真愛只有你", artist:"傅振輝、林姍", lang:"台語", page:"第071頁", len:"5" },
  { who:"妹妹", id:"912614", title:"真愛無後悔", artist:"蔡小虎、陳美鳳", lang:"台語", page:"第071頁", len:"5" },

  // TODO: 你在這裡貼入你的 20000 筆資料
];

// ===== 小工具 =====
const $ = (id) => document.getElementById(id);
const toast = (msg, sub="") => {
  $("toastMsg").textContent = msg;
  $("toastSub").textContent = sub;
  $("toast").classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=> $("toast").classList.remove("show"), 2000);
};
function normalize(s){ return (s ?? "").toString().toLowerCase().trim(); }
function escapeHtml(s){
  return (s ?? "").toString()
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
async function copyToClipboard(text){
  try{ await navigator.clipboard.writeText(text); }
  catch(_){
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  }
}

// ===== 虛擬清單設定 =====
const ROW_H = 72;  // 要跟 CSS --rowH 一致
const OVERSCAN = 10;

// ===== 狀態 =====
let base = [];          // 原始資料（整理後）
let viewUIDs = [];      // 篩選後的 uid（uid = base index）
let copyLine = [];      // uid -> 複製字串

// 排序：點表頭升冪→降冪→取消
let sortKey = "";
let sortDir = "";

// 欄位顯示（預設只顯示：編號 / 歌名 / 歌手；其他在後面）
const shown = { who:false, lang:false, page:false, len:false };

// 下拉篩選（空字串=全部）
const filters = { lang:"", len:"", who:"" };

// ===== 欄位定義 =====
const COLS_BASE = [
  { key:"copy",  label:"",     sortable:false, widthVar:"--copyCol" },
  { key:"id",    label:"編號", sortable:true,  widthVar:"--colA", wrap2:true },
  { key:"title", label:"歌名", sortable:true,  widthVar:"--colB", wrap2:true },
  { key:"artist",label:"歌手", sortable:true,  widthVar:"--colC", wrap2:true },
];
const COLS_EXTRA = [
  { key:"lang", label:"語言", sortable:true, widthVar:"--colLang" },
  { key:"len",  label:"字數", sortable:true, widthVar:"--colLen" },
  { key:"who",  label:"誰的歌", sortable:true, widthVar:"--colWho" },
  { key:"page", label:"頁數", sortable:true, widthVar:"--colPage" },
];

// ===== 初始化 =====
function init(){
  base = SONGS.map(r => ({
    who: (r.who ?? "").toString().trim(),
    id: (r.id ?? "").toString().trim(),
    title: (r.title ?? "").toString().trim(),
    artist: (r.artist ?? "").toString().trim(),
    lang: (r.lang ?? "").toString().trim(),
    page: (r.page ?? "").toString().trim(),
    len: (r.len ?? "").toString().trim(), // ✅ 字數來源為變數
  }));

  copyLine = base.map(r => {
    // 複製格式：誰的歌 編號 歌名 歌手 語言 頁數 字數（tab 分隔）
    return [r.who, r.id, r.title, r.artist, r.lang, r.page, r.len].filter(x => x !== "").join("\t");
  });

  buildFilterOptions();
  bindUI();
  rebuildColumnsAndHeader();
  applyFilterSortRender(true);
}

// ===== 下拉選單選項 =====
const MAX_OPTIONS = 250;
function uniqueValues(key){
  const set = new Set();
  for(const r of base){
    const v = (r[key] ?? "").toString().trim();
    if(v) set.add(v);
  }
  return Array.from(set);
}
function setSelectOptions(selectEl, values, placeholder="全部"){
  selectEl.innerHTML = "";
  selectEl.appendChild(new Option(placeholder, ""));
  if(values.length > MAX_OPTIONS){
    const opt = new Option(`（選項太多：${values.length}）`, "");
    opt.disabled = true;
    selectEl.appendChild(opt);
    return;
  }
  for(const v of values){
    selectEl.appendChild(new Option(v, v));
  }
}
function buildFilterOptions(){
  const langs = uniqueValues("lang").sort((a,b)=>a.localeCompare(b, "zh-Hant"));
  const whos  = uniqueValues("who").sort((a,b)=>a.localeCompare(b, "zh-Hant"));

  // ✅ 字數：1,2,3...（資料中的 len）
  const lens = uniqueValues("len")
    .sort((a,b)=> (Number(a)||0) - (Number(b)||0));

  setSelectOptions($("filterLang"), langs, "全部");
  setSelectOptions($("filterLen"), lens, "全部");
  setSelectOptions($("filterWho"), whos, "全部");
}

// ===== UI 綁定 =====
function currentMatchMode(){
  return document.querySelector('input[name="matchMode"]:checked')?.value || "fuzzy";
}

function bindUI(){
  // 文字查詢
  $("q").addEventListener("keydown", (e) => {
    if(e.key === "Enter"){
      applyFilterSortRender();
      toast("已套用文字篩選", `顯示 ${viewUIDs.length.toLocaleString()} 筆`);
    }else if(e.key === "Escape"){
      $("q").value = "";
      toast("已清空文字輸入", "（不自動篩選）");
    }
  });
  $("btnFilter").addEventListener("click", () => {
    applyFilterSortRender();
    toast("已套用篩選", `顯示 ${viewUIDs.length.toLocaleString()} 筆`);
  });

  // 模式（互斥 radio）
  $("modeFuzzy").addEventListener("change", ()=>{ /* 不強制自動篩選 */ });
  $("modeExact").addEventListener("change", ()=>{ /* 不強制自動篩選 */ });

  // 下拉選單：改了就自動篩選（可多重）
  $("filterLang").addEventListener("change", () => { filters.lang = $("filterLang").value; applyFilterSortRender(); });
  $("filterLen").addEventListener("change", () => { filters.len  = $("filterLen").value;  applyFilterSortRender(); });
  $("filterWho").addEventListener("change", () => { filters.who  = $("filterWho").value;  applyFilterSortRender(); });

  // 欄位顯示切換
  $("colWho").addEventListener("change", () => { shown.who = $("colWho").checked; rebuildColumnsAndHeader(); applyFilterSortRender(true); });
  $("colLang").addEventListener("change", () => { shown.lang = $("colLang").checked; rebuildColumnsAndHeader(); applyFilterSortRender(true); });
  $("colPage").addEventListener("change", () => { shown.page = $("colPage").checked; rebuildColumnsAndHeader(); applyFilterSortRender(true); });
  $("colLen").addEventListener("change", () => { shown.len = $("colLen").checked; rebuildColumnsAndHeader(); applyFilterSortRender(true); });

  // 捲動
  $("viewport").addEventListener("scroll", () => render());
  window.addEventListener("resize", () => render());

  // 列表事件代理：複製按鈕（不要觸發列點擊）
  $("rows").addEventListener("click", async (e) => {
    const copyBtn = e.target.closest("[data-copy-uid]");
    if(copyBtn){
      e.stopPropagation();
      const uid = Number(copyBtn.getAttribute("data-copy-uid"));
      const text = copyLine[uid] ?? "";
      await copyToClipboard(text);
      toast("已複製", base[uid]?.title ? `「${base[uid].title}」` : "");
      return;
    }

    const row = e.target.closest("[data-row-uid]");
    if(row){
      const uid = Number(row.getAttribute("data-row-uid"));
      openModal(uid);
    }
  });

  // Modal
  $("modalClose").addEventListener("click", closeModal);
  $("modalClose2").addEventListener("click", closeModal);
  $("modalBack").addEventListener("click", (e) => {
    if(e.target === $("modalBack")) closeModal();
  });
  document.addEventListener("keydown", (e) => {
    if(e.key === "Escape" && $("modalBack").classList.contains("show")) closeModal();
  });
  $("modalCopy").addEventListener("click", async () => {
    const uid = window.__modalUID;
    if(uid == null) return;
    await copyToClipboard(copyLine[uid] ?? "");
    toast("已複製", base[uid]?.title ? `「${base[uid].title}」` : "");
  });
}

// ===== 欄位 / 表頭 / Grid =====
function getActiveCols(){
  const cols = [...COLS_BASE];
  // 其他欄位排列在後面（依你想要的順序：語言、字數、誰的歌、頁數）
  if(shown.lang) cols.push(COLS_EXTRA.find(c=>c.key==="lang"));
  if(shown.len)  cols.push(COLS_EXTRA.find(c=>c.key==="len"));
  if(shown.who)  cols.push(COLS_EXTRA.find(c=>c.key==="who"));
  if(shown.page) cols.push(COLS_EXTRA.find(c=>c.key==="page"));
  return cols.filter(Boolean);
}

function rebuildColumnsAndHeader(){
  const cols = getActiveCols();

  // 設定 CSS --grid
  const parts = cols.map(c => `var(${c.widthVar})`);
  document.documentElement.style.setProperty("--grid", parts.join(" "));

  // 估算最小寬
  let minW = 0;
  for(const c of cols){
    if(c.widthVar === "--copyCol") minW += 70;
    else if(c.widthVar === "--colA" || c.widthVar === "--colB" || c.widthVar === "--colC") minW += 220;
    else if(c.widthVar === "--colLang") minW += 120;
    else if(c.widthVar === "--colLen") minW += 90;
    else if(c.widthVar === "--colWho") minW += 140;
    else if(c.widthVar === "--colPage") minW += 120;
    else minW += 120;
  }
  $("tableMinWidth").style.minWidth = Math.max(760, minW) + "px";

  // 表頭
  const thead = $("thead");
  let html = "";
  for(const c of cols){
    if(c.key === "copy"){
      html += `<div class="th"></div>`;
      continue;
    }

    const isActive = (sortKey === c.key);
    const mark =
      !isActive ? `<span class="sortMark off">↕</span>` :
      (sortDir === "asc") ? `<span class="sortMark">↑</span>` :
      (sortDir === "desc") ? `<span class="sortMark">↓</span>` :
      `<span class="sortMark off">↕</span>`;

    html += `
      <div class="th sortable" data-sort-key="${c.key}">
        <span>${escapeHtml(c.label)}</span>
        ${mark}
      </div>
    `;
  }
  thead.innerHTML = html;

  // 點表頭排序：升冪 → 降冪 → 取消
  thead.onclick = (e) => {
    const el = e.target.closest("[data-sort-key]");
    if(!el) return;
    const key = el.getAttribute("data-sort-key");
    if(sortKey !== key){
      sortKey = key;
      sortDir = "asc";
    }else{
      if(sortDir === "asc") sortDir = "desc";
      else if(sortDir === "desc"){ sortKey = ""; sortDir = ""; }
      else sortDir = "asc";
    }
    rebuildColumnsAndHeader(); // 更新箭頭
    applyFilterSortRender();
  };
}

// ===== 篩選 / 排序 =====
function passDropdownFilters(r){
  if(filters.lang && r.lang !== filters.lang) return false;
  if(filters.len  && r.len  !== filters.len)  return false;
  if(filters.who  && r.who  !== filters.who)  return false;
  return true;
}

function combinedText(r){
  return normalize([r.who, r.id, r.title, r.artist, r.lang, r.page, r.len].join(" "));
}
function passTextFilter(r){
  const q = normalize($("q").value);
  if(!q) return true;
  const mode = currentMatchMode();
  const t = combinedText(r);

  if(mode === "fuzzy"){
    const tokens = q.split(/\s+/).filter(Boolean);
    for(const tok of tokens){
      if(!t.includes(tok)) return false;
    }
    return true;
  }else{
    return t.includes(q);
  }
}

function getSortVal(r, key){
  if(key === "len") return Number(r.len) || 0;
  if(key === "id") return normalize(r.id);
  if(key === "title") return normalize(r.title);
  if(key === "artist") return normalize(r.artist);
  if(key === "who") return normalize(r.who);
  if(key === "lang") return normalize(r.lang);
  if(key === "page") return normalize(r.page);
  return normalize(r.title);
}

function applyFilterSortRender(keepScroll=false){
  const prevTop = $("viewport").scrollTop;

  // 篩選
  const uids = [];
  for(let uid=0; uid<base.length; uid++){
    const r = base[uid];
    if(!passDropdownFilters(r)) continue;
    if(!passTextFilter(r)) continue;
    uids.push(uid);
  }

  // 排序（sortKey 空 = 不排序）
  if(sortKey && sortDir){
    const sign = (sortDir === "asc") ? 1 : -1;
    uids.sort((a,b)=>{
      const ra = base[a], rb = base[b];
      const va = getSortVal(ra, sortKey);
      const vb = getSortVal(rb, sortKey);

      // len 用數字排序
      if(sortKey === "len"){
        return (va - vb) * sign || (a-b);
      }

      if(va < vb) return -1*sign;
      if(va > vb) return  1*sign;
      return (a-b);
    });
  }

  viewUIDs = uids;
  $("countPill").textContent = `共 ${base.length.toLocaleString()} 筆｜顯示 ${viewUIDs.length.toLocaleString()} 筆`;

  updateSpacer();
  render();

  if(keepScroll){
    $("viewport").scrollTop = Math.min(prevTop, Math.max(0, viewUIDs.length*ROW_H - $("viewport").clientHeight));
  }else{
    $("viewport").scrollTop = 0;
  }
}

function updateSpacer(){
  $("spacer").style.height = (viewUIDs.length * ROW_H + 8) + "px";
}

// ===== 虛擬渲染 =====
function render(){
  const vp = $("viewport");
  const rows = $("rows");
  const scrollTop = vp.scrollTop;
  const height = vp.clientHeight;

  const start = Math.max(0, Math.floor(scrollTop / ROW_H) - OVERSCAN);
  const end = Math.min(viewUIDs.length, Math.ceil((scrollTop + height) / ROW_H) + OVERSCAN);

  rows.style.transform = `translateY(${start * ROW_H}px)`;

  const cols = getActiveCols();
  let html = "";

  for(let i=start; i<end; i++){
    const uid = viewUIDs[i];
    const r = base[uid];

    const cells = [];
    for(const c of cols){
      if(c.key === "copy"){
        cells.push(`
          <div class="cell copyWrap">
            <button class="copyBtn" title="複製這一筆" data-copy-uid="${uid}">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 9h10v12H9V9Z" stroke="currentColor" stroke-width="1.8" />
                <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" stroke="currentColor" stroke-width="1.8" />
              </svg>
            </button>
          </div>
        `);
        continue;
      }

      if(c.key === "id"){
        cells.push(`<div class="cell wrap2" title="${escapeHtml(r.id)}">${escapeHtml(r.id)}</div>`);
      }else if(c.key === "title"){
        cells.push(`<div class="cell wrap2" title="${escapeHtml(r.title)}">${escapeHtml(r.title)}</div>`);
      }else if(c.key === "artist"){
        cells.push(`<div class="cell wrap2" title="${escapeHtml(r.artist)}">${escapeHtml(r.artist)}</div>`);
      }else if(c.key === "lang"){
        cells.push(`<div class="cell"><span class="tag">${escapeHtml(r.lang)}</span></div>`);
      }else if(c.key === "len"){
        cells.push(`<div class="cell small" title="${escapeHtml(r.len)}">${escapeHtml(r.len)}</div>`);
      }else if(c.key === "who"){
        cells.push(`<div class="cell small" title="${escapeHtml(r.who)}">${escapeHtml(r.who)}</div>`);
      }else if(c.key === "page"){
        cells.push(`<div class="cell small" title="${escapeHtml(r.page)}">${escapeHtml(r.page)}</div>`);
      }else{
        cells.push(`<div class="cell"></div>`);
      }
    }

    html += `<div class="row" data-row-uid="${uid}">${cells.join("")}</div>`;
  }

  rows.innerHTML = html;
}

// ===== 詳細視窗 =====
function openModal(uid){
  const r = base[uid];
  if(!r) return;
  window.__modalUID = uid;

  $("modalTitle").textContent = r.title ? `詳細資料：${r.title}` : "詳細資料";

  const items = [
    ["編號", r.id],
    ["歌名", r.title],
    ["歌手", r.artist],
    ["語言", r.lang],
    ["字數", r.len],
    ["誰的歌", r.who],
    ["頁數", r.page],
  ];

  let html = "";
  for(const [k,v] of items){
    html += `<div class="k">${escapeHtml(k)}</div><div class="v">${escapeHtml(v || "")}</div>`;
  }
  $("modalBody").innerHTML = html;

  $("modalBack").classList.add("show");
  $("modalBack").setAttribute("aria-hidden","false");
}

function closeModal(){
  $("modalBack").classList.remove("show");
  $("modalBack").setAttribute("aria-hidden","true");
  window.__modalUID = null;
}

// ===== 啟動 =====
init();
</script>
